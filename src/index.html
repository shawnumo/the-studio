<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>The Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* The Studio design system (docs/design.md). Layout: 232px rail | workspace; mobile: one pane + bottom bar. */
  --ground:#111315;--rail:#0D0F11;--raised:#1B1E22;--sunk:#0B0D0F;
  --line:#24282D;--line2:#33383F;
  --text:#E9E6DF;--text2:#A3A7AD;--text3:#868B92;--white:#FFFFFF;
  --amber:#F0B43C;--amber-tint:#1F1B12;--amber-line:#3A3018;--on-amber:#1C1405;
  --blue:#7FB2F0;--blue-tint:#121B26;--blue-line:#22344A;--blue-text:#D6E4F5;
  --green:#5DBB8A;--green-line:#2F5A44;
  --red:#E0626B;--red-tint:#24151A;--red-line:#4A2229;--red-text:#F2C9CD;
  --amber-ink:#F0B43C;--amber-mark:#F0B43C;--amber-hover:#F5C25A;--line3:#4A5059;--hover:#15181B;--sheet:#16191C;--scrim:rgba(6,7,8,.6);--skel:#1B1E22;
  --body:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
/* Light theme (S17): follows the device. Same meanings; darker inks keep text at AA contrast on light grounds.
   Amber stays the fill for buttons and markers; amber text, focus rings and the caret use --amber-ink. */
@media (prefers-color-scheme: light){
  :root{
    --ground:#F6F5F2;--rail:#ECEAE5;--raised:#FFFFFF;--sunk:#FFFFFF;
    --line:#E0DDD6;--line2:#BDB8AE;--line3:#8F8A80;
    --text:#1A1C1F;--text2:#4A4F56;--text3:#626870;--white:#000000;
    --amber-ink:#8A5A00;--amber-mark:#B57B0C;--amber-tint:#FBF0D9;--amber-line:#EBD3A0;
    --blue:#1F5FAE;--blue-tint:#E7EFF9;--blue-line:#C3D6EE;--blue-text:#1D3A5E;
    --green:#1A7347;--green-line:#A8D1BB;
    --red:#B32D3A;--red-tint:#FBEAEC;--red-line:#EDBFC5;--red-text:#6B1C25;
    --hover:#EFEDE8;--sheet:#FFFFFF;--scrim:rgba(20,22,25,.32);--skel:#E4E1DA;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;caret-color:var(--amber-ink);scrollbar-color:var(--line2) var(--ground)}
::selection{background:rgba(240,180,60,.28);color:var(--white)}
:focus-visible{outline:2px solid var(--amber-ink);outline-offset:2px}
a{color:var(--text);text-underline-offset:3px}a:hover{color:var(--white)}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
#root{min-height:100%}
.app{display:flex;min-height:100vh;min-height:100dvh}
.rail{flex:0 0 232px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;padding:12px 8px}
.nav a,.plist a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;padding:0 12px;color:var(--text2);text-decoration:none}
.nav a[aria-current="page"],.plist a[aria-current="page"]{background:var(--raised);color:var(--white);font-weight:600}
.plist{display:flex;flex-direction:column;padding:8px 8px 12px;border-top:1px solid var(--line);overflow:auto}
.plist h2{margin:8px 12px 6px;font-size:13px;font-weight:600;color:var(--text2)}
.plist a{height:32px;color:var(--text)}
.plist a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist small{font-size:12px;color:var(--text3)}
.rail-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--text3);display:flex;flex-direction:column;gap:2px}
.dot{display:inline-block;width:6px;height:6px;margin-right:8px;vertical-align:1px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;min-height:56px;padding:10px 32px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.top .meta{font-size:12px;color:var(--text3);margin-left:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:12px;color:var(--text3)}
.status.bad{color:var(--red)}
.banner{padding:10px 32px;border-bottom:1px solid var(--line2);background:var(--raised);font-size:13px;color:var(--text2)}
.banner b{color:var(--text)}
.banner.err{background:var(--red-tint);border-color:var(--red-line);color:var(--red-text)}
.banner.err b{color:var(--red)}
section.block{padding:28px 32px 8px}
section.block h2{margin:0 0 10px;font-size:16px;font-weight:700}
section.block h2 .n{font-weight:400;color:var(--text3)}
.lead{margin:0 0 12px;color:var(--text2);max-width:65ch}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:34px;padding:0 14px;border-radius:2px;border:1px solid var(--line2);background:var(--raised);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--line3);color:var(--white)}
.btn.primary{border:0;background:var(--amber);color:var(--on-amber);font-weight:700}
.btn.primary:hover{background:var(--amber-hover);color:var(--on-amber)}
.btn.ghost{background:transparent;color:var(--text2);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn kbd{font-family:var(--mono);font-size:11px;color:var(--text3)}
.btn.primary kbd{color:#5A4512}
.capbtn{display:flex;align-items:center;gap:24px;height:36px;padding:0 12px;border-radius:2px;border:1px solid var(--line2);background:var(--sunk);color:var(--text2);cursor:pointer}
.capbtn:hover{border-color:var(--line3);color:var(--text)}
.capbtn kbd{font-family:var(--mono);font-size:11px;color:var(--text3)}

/* Needs you */
.needs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.needs li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:52px;padding:6px 12px;border-bottom:1px solid var(--line)}
.needs li.first{background:var(--amber-tint)}
.needs .num{font-family:var(--mono);font-size:12px;color:var(--text3)}
.needs li.first .num{color:var(--amber-ink)}
.needs .what{display:flex;flex-direction:column;min-width:0}
.needs .what a{font-weight:600;text-decoration:none}
.needs .what span{font-size:12px;color:var(--text2)}
.needs .open{font-size:13px;color:var(--text2)}
.caught{display:flex;flex-direction:column;gap:4px;padding:14px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.caught b{display:flex;align-items:center;gap:8px}

/* Phase grid */
.scroll{overflow-x:auto}
table.grid{width:100%;min-width:860px;border-collapse:collapse;table-layout:fixed}
table.grid th,table.grid td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.grid thead th{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;font-weight:500;color:var(--text3)}
table.grid tbody th{font-weight:600}
table.grid tbody th a{text-decoration:none}
table.grid td.done{padding-right:0}
.track{display:flex;align-items:center;gap:8px}
.track i{flex:1;height:1px;background:var(--green-line)}
td.now{background:var(--amber-tint)}
.nowcell{display:flex;flex-direction:column}
.nowcell b{display:flex;align-items:center;gap:8px;font-weight:600}
.nowcell b::before{content:"";width:8px;height:8px;background:var(--amber-mark)}
.nowcell span{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.last{text-align:right;font-family:var(--mono);font-size:12px;color:var(--text2)}

/* Inbox list */
.caps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.caps li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.caps .t{min-width:0}
.caps .m{font-size:12px;color:var(--text3)}
.caps .acts{display:flex;gap:6px}

/* Project page */
.ptabs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap}
.ptabs a{display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border-bottom:2px solid transparent;color:var(--text2);text-decoration:none}
.ptabs a .mono{font-size:11px;color:var(--text3)}
.ptabs a.done .mono{color:var(--green)}
.ptabs a[aria-current="step"]{border-bottom-color:var(--amber-mark);color:var(--white);font-weight:700}
.ptabs a[aria-current="step"] .mono{color:var(--amber-ink)}
.top.ph{padding-top:0;padding-bottom:0;align-items:stretch}
.top.ph .tt{display:flex;align-items:baseline;gap:12px;padding:14px 0;flex-wrap:wrap}
.pbody{display:flex;flex-wrap:wrap;flex:1}
.pmain{flex:999 1 520px;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:28px;max-width:860px}
.pside{flex:1 1 340px;background:var(--rail);border-left:1px solid var(--line)}
.pside section{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pside h2{margin:0;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text2)}
.input,.area{width:100%;border-radius:2px;border:1px solid var(--line2);background:var(--sunk);color:var(--text);padding:0 12px}
.input{height:38px;font-size:14px}
.area{padding:10px 12px;font-size:15px;line-height:1.5;resize:vertical;min-height:72px}
.input:focus,.area:focus{border-color:var(--amber-ink);outline:none}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--green);flex:none}
.checks label.on span{color:var(--text3)}
.gate{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--amber-tint);border:1px solid var(--amber-line)}
.gate ul{margin:0;padding-left:18px;color:var(--text2)}
.soon{padding:14px 16px;background:var(--blue-tint);border:1px solid var(--blue-line);color:var(--blue-text);font-size:14px;max-width:65ch}
.soon b{color:var(--blue)}
.goal{margin:0;font-size:16px;color:var(--text2);max-width:62ch}
.goal b{color:var(--text)}
.produces{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.produces li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.produces .mono{font-size:12px;color:var(--text3)}

/* Build monitor (S16) */
.syncbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 32px;background:var(--rail);border-bottom:1px solid var(--line);font-size:13px;color:var(--text2)}
.syncbar .st{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;min-width:0}
.syncbar .st b{font-weight:500;color:var(--text)}
.syncbar.err{background:var(--red-tint);border-color:var(--red-line);color:var(--red-text)}
.syncbar.err b{font-weight:700;color:var(--red)}
.pbody.build .pmain{max-width:none;flex:999 1 600px;gap:24px}
.pbody.build .pside{flex:1 1 360px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.sechead h2{margin:0;font-size:16px;font-weight:700}
.sechead .n,.pside h2 .n{font-weight:400;font-size:13px;color:var(--text3)}
table.slices{width:100%;min-width:700px;border-collapse:collapse;table-layout:fixed}
table.slices th,table.slices td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.slices thead th{padding:8px 12px;border-top:1px solid var(--line);font-size:12px;font-weight:500;color:var(--text3)}
table.slices tbody th{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text2)}
table.slices tr.grp th{padding:16px 12px 6px;font-family:var(--body);font-size:13px;font-weight:600;color:var(--text2)}
table.slices tr.hl{background:var(--amber-tint)}
.ellip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sst{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sst.done{color:var(--green)}
.sst.check{gap:8px;font-weight:700;color:var(--white)}
.sst.check::before{content:"";width:8px;height:8px;background:var(--amber-mark)}
.sst.todo{color:var(--text3)}
.sst small{font-weight:400;font-size:12px;color:var(--text3)}
.callout{display:flex;flex-direction:column;gap:10px;padding:12px 14px;background:var(--amber-tint);border:1px solid var(--amber-line)}
.callout p{margin:0}
.callout ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--amber-line)}
.callout li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--amber-line)}
.callout .hint{font-size:13px;color:var(--text2)}
.callout .row{display:flex;flex-wrap:wrap;gap:8px}
.notice{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 14px;background:var(--raised);border:1px solid var(--line2);font-size:13px;color:var(--text2)}
.notice b{color:var(--text);font-weight:600}
ol.log{list-style:none;margin:0 -24px;padding:0;border-top:1px solid var(--line)}
ol.log li{display:flex;flex-direction:column;gap:4px;padding:12px 24px;border-bottom:1px solid var(--line)}
ol.log .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
ol.log .h b{font-weight:600}
ol.log .tx{font-size:13px;color:var(--text2)}
ol.log .ts{font-size:12px;color:var(--text3)}
ol.log .pass{font-family:var(--mono);color:var(--green)}
.mslices{list-style:none;margin:0 -16px;padding:0;border-top:1px solid var(--line)}
.mslices li{border-bottom:1px solid var(--line)}
.mslices .mrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto 10px;gap:10px;align-items:center;width:100%;min-height:52px;padding:6px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mslices .msd{padding:0 16px 12px 60px}
.mslices li.grp{display:block;min-height:0;padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--text2)}
.mslices li.hl{background:var(--amber-tint)}
.mslices .id{font-family:var(--mono);font-size:12px;color:var(--text2)}
.mslices .sst{font-size:13px}
.mslices .mt{display:flex;flex-direction:column;gap:2px;min-width:0}
.mslices .mc{font-size:12px;color:var(--text3)}
table.slices tr.srow{cursor:pointer}
table.slices tr.srow:not(.hl):hover{background:var(--hover)}
table.slices tr.srow.open th,table.slices tr.srow.open td{border-bottom-color:transparent}
table.slices tr.sdet td{padding:0 12px 14px}
table.slices tr.srow.open td:nth-child(2) .ellip{white-space:normal;overflow:visible}
table.slices tr.sdet.hl{background:var(--amber-tint)}
.disc{display:inline-flex;align-items:center;gap:8px;padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer}
.chev{flex:none;color:var(--text3);transition:transform .15s}
.open .chev{transform:rotate(90deg);color:var(--text2)}
.sd{display:flex;flex-direction:column;gap:8px;min-width:0}
.sdc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sdc li{display:grid;grid-template-columns:64px 104px minmax(0,1fr);gap:10px;align-items:baseline;padding:0;border:0;font-size:13px}
.sdc .h,.sdc .d{font-size:12px;color:var(--text3)}
.sdc .m{color:var(--text2);overflow-wrap:anywhere}
.sd .none{margin:0;font-size:13px;color:var(--text3)}
.btabs{display:none}
.linkbtn{padding:0;border:0;background:none;color:var(--text);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--white)}
.syncbar.err .linkbtn{color:var(--red-text)}
.inline-err{margin:0;font-size:13px;color:var(--red-text)}
.inline-err b{color:var(--red)}
.input.mono{font-family:var(--mono);font-size:13px}
textarea.prompt{width:100%;height:46vh;border-radius:2px;border:1px solid var(--line2);background:var(--sunk);color:var(--text2);padding:10px 12px;font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical}
table.preview{border-collapse:collapse;font-size:13px}
table.preview th{text-align:left;font-weight:400;color:var(--text2);padding:3px 16px 3px 0;vertical-align:top}
table.preview td{font-family:var(--mono)}

/* Inbox and triage (S3) */
.inbox{display:flex;flex-wrap:wrap;flex:1;min-height:0}
.ilist{flex:1 1 400px;min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.ftabs{display:flex;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.ftabs button{flex:none;display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text2);cursor:pointer}
.ftabs button[aria-pressed="true"]{border-bottom-color:var(--amber-mark);color:var(--white);font-weight:700}
.ftabs .mono{font-size:12px;font-weight:400;color:var(--text2)}
.irows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.ilist .irows{border-top:0}
.irows li{border-bottom:1px solid var(--line)}
.irows a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 16px;color:var(--text);text-decoration:none}
.irows a:hover{background:var(--hover)}
.irows a[aria-current="true"]{background:var(--raised)}
.irows .tx{overflow-wrap:anywhere}
.irows .killed .tx{text-decoration:line-through;color:var(--text3)}
.irows .sc{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.irows .sc i{font-style:normal;color:var(--text3)}
.irows .vl{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12px;color:var(--text3)}
.verd{display:inline-flex;align-items:center;gap:5px;font-weight:700}
.verd.promising{color:var(--white)}
.verd.park{color:var(--text2)}
.verd.killed{color:var(--red)}
.verd.pending{color:var(--blue);font-weight:600}
.verd.none{color:var(--text3);font-weight:500}
.idetail{flex:2 1 560px;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:24px;max-width:820px}
.idetail h2.cap{margin:0;font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.01em;max-width:40ch;overflow-wrap:anywhere}
.idetail h3{margin:0;font-size:15px;font-weight:700}
.ai{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--blue-tint);border:1px solid var(--blue-line)}
.ai h3{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0;font-size:14px;font-weight:700;color:var(--blue)}
.ai p{margin:0;font-size:15px;color:var(--blue-text);max-width:62ch}
.ai .tags{font-size:13px;color:var(--blue-text)}
.ai .linkbtn{font-size:13px;font-weight:500;color:var(--blue)}
.errbox{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px;background:var(--red-tint);border:1px solid var(--red-line);color:var(--red-text);font-size:13px}
.errbox b{color:var(--red)}
.rub{width:100%;border-collapse:collapse}
.rub th,.rub td{padding:8px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rub thead th{padding:6px 0;font-size:12px;font-weight:500;color:var(--text3)}
.rub tbody th{padding-right:12px;font-weight:600;white-space:nowrap}
.rub td.q{padding-right:12px;color:var(--text2)}
.rub td.s{text-align:right;white-space:nowrap}

<body>
<div id="root"></div>

<script>
"use strict";
/* ---------- Framework constants ---------- */
const PHASES = [
  {key:"discover", name:"Discover", goal:"Find an idea worth two weeks", next:"Talk the idea through with the coach",
   produces:[["Idea score","rubric, 6 rows"],["One-liner","For who, struggle, app, unlike"]],
   checklist:["The one-liner is written and every blank is filled","At least 2 real people said they'd use it","Score of 3 or more on every rubric row"]},
  {key:"define", name:"Define", goal:"Pin down exactly what v1 does", next:"Draft the PRD and user stories",
   produces:[["PRD","docs/PRD.md"],["User stories","docs/stories.md"],["NFRs","docs/nfrs.md"]],
   checklist:["The PRD fits on one page and lists the non-goals","Every Must story has acceptance criteria","v1 has 10 or fewer Must stories","The Cost and Reachability NFRs are written down"]},
  {key:"design", name:"Design", goal:"Choose the lightest architecture", next:"Pick the lightest architecture on the ladder",
   produces:[["Architecture","docs/architecture.md"],["Decisions","docs/adr/"]],
   checklist:["Tier chosen, with the reason in an ADR","Context diagram drawn, plus an ERD or state machine if needed","Repo scaffolded, CI green on an empty app"]},
  {key:"build", name:"Build", goal:"Ship thin slices, always deployable", next:"Build the next slice",
   produces:[["Slices","docs/stories.md"],["Progress log","docs/progress.md"]],
   checklist:["Every Must story is live at the production URL","CI is green; tests cover the main journeys","No secrets in the repo; .env.example is up to date"]},
  {key:"ship", name:"Ship", goal:"Real people using it", next:"Run the launch checklist",
   produces:[["Launch record","live URL, checklist"],["Changelog","CHANGELOG.md"]],
   checklist:["The launch checklist passes","At least 3 real users have used it","Feedback is captured and the next version is scoped"]}
];
const PH = Object.fromEntries(PHASES.map((p, i) => [p.key, {...p, n: i + 1}]));
/* The Discover rubric, as the Build Framework states it. q is shown to Shawn; p goes to Claude. */
const RUBRIC = [
  {key:"pain", name:"Pain", q:"Does a real person feel this weekly?", p:"Does a real person feel this problem weekly?"},
  {key:"access", name:"Access", q:"Can you reach 5 users this week?", p:"Can the builder reach 5 potential users this week?"},
  {key:"scope", name:"Scope", q:"Can a v1 ship in 2 to 4 weeks?", p:"Can a useful v1 ship in 2 to 4 weeks of part-time work?"},
  {key:"cost", name:"Free to run", q:"Can it run on free tiers?", p:"Can it run on free tiers, with no paid APIs, servers or data?"},
  {key:"learning", name:"Learning", q:"Does it teach you a skill you want?", p:"Does it teach the builder a skill they want?"},
  {key:"motivation", name:"Motivation", q:"Will you still care in week 3?", p:"Will the builder still care in week 3?"}
];
const VERDICTS = [["promising", "Promising"], ["park", "Park"], ["killed", "Killed"]];
const VNAME = Object.fromEntries(VERDICTS);
const ABOUT_DEFAULT = "Software engineering student in Lagos, Nigeria, building solo on a $0 budget with Claude Code. Uses a phone and a laptop equally. Wants skills in data and realtime apps, building toward sports analytics.";

/* ---------- State ---------- */
const S = {
  db:null, backend:"loading", loadNote:"", online:navigator.onLine,
  projects:[], captures:[], route:{view:"board"},
  overlay:null, confirm:null, dirty:new Set(), saveT:{}, statusText:"", statusBad:false,
  /* S16 repo sync */
  mcp:null, host:"unknown",            // host: unknown | listed (file server reachable in the Claude app) | none
  syncs:{},                            // projectId -> snapshot from db (shared by every device)
  sync:{},                             // projectId -> {kind, text, file, startedAt} for this session only
  autoDone:{}, buildTab:"slices", overlayFor:null, paste:null, needRender:false,
  open:new Set(),                      // "projectId:sliceId" rows expanded in the Build monitor
  /* S3 triage */
  sample:null, sampleOff:"",           // sampleOff: the code that turned Claude off for this view
  about:null, ifilter:"all", triaging:new Set(),
  /* S4 Discover coach */
  chats:{}, chatState:{}, chatW:{}, chatWroteAt:{},   // chats/{projectId}: messages, notes, free; chatState: loading | slow | ready | error
  coach:{}, drafts:{}, dtab:"coach", coachSeen:"", focusCompose:false,   // coach: projectId -> {busy, text, raw, ctrl} or {err} or {stopped}
  trimLater:{}                         // projects where Shawn said "Not now" to trimming, this session
};

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const device = () => (window.matchMedia && matchMedia("(pointer: coarse)").matches) ? "phone" : "laptop";
const isMobile = () => window.matchMedia && matchMedia("(max-width: 820px)").matches;
const MARK = (accent = "var(--amber-mark)") => `<svg width="18" height="16" viewBox="0 0 18 16" aria-hidden="true"><rect x="0" y="10" width="2" height="6" style="fill:var(--text3)"/><rect x="4" y="7" width="2" height="9" style="fill:var(--text3)"/><rect x="8" y="4" width="2" height="12" style="fill:var(--text3)"/><rect x="12" y="1" width="2" height="15" style="fill:var(--text3)"/><rect x="16" y="0" width="2" height="16" style="fill:${accent}"/></svg>`;
const CHECK = `<svg width="14" height="14" viewBox="0 0 14 14" aria-label="Done" role="img" fill="none" style="stroke:var(--green)" stroke-width="2"><path d="m2.5 7.5 3 3 6-7"/></svg>`;

function ago(ts){
  if (!ts) return "";
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 90) return "now";
  if (s < 3600) return Math.round(s / 60) + " min";
  if (s < 86400) return Math.round(s / 3600) + " h";
  const d = Math.round(s / 86400);
  return d === 1 ? "1 day" : d + " days";
}
function when(ts){
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  const day = d.toDateString() === now.toDateString() ? "today" : d.toLocaleDateString(undefined, {weekday:"short"});
  return day + " " + d.toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit", hour12:false});
}

function normalize(p){
  p.name = (p.name || "Untitled project").slice(0, 80);
  p.phase = PH[p.phase] ? p.phase : "discover";
  p.completed = p.completed && typeof p.completed === "object" ? p.completed : {};
  p.checks = p.checks && typeof p.checks === "object" ? p.checks : {};
  for (const ph of PHASES){
    const c = Array.isArray(p.checks[ph.key]) ? p.checks[ph.key] : [];
    p.checks[ph.key] = ph.checklist.map((_, i) => !!c[i]);
  }
  p.nextStep = typeof p.nextStep === "string" ? p.nextStep : "";
  p.oneLiner = typeof p.oneLiner === "string" ? p.oneLiner : "";
  p.repo = typeof p.repo === "string" ? p.repo : "";
  p.liveUrl = typeof p.liveUrl === "string" ? p.liveUrl : "";
  p.createdAt = p.createdAt || Date.now();
  p.updatedAt = p.updatedAt || p.createdAt;
  return p;
}
const active = () => S.projects.filter(p => !p.archived && !(p.completed.ship));
const proj = id => S.projects.find(p => p.id === id);
const progress = (p, key = p.phase) => { const c = p.checks[key] || []; return [c.filter(Boolean).length, c.length]; };
const nextText = p => p.nextStep.trim() || (p.phase === "build" && sliceInfo(p).total ? sliceInfo(p).next : PH[p.phase].next);
/* Board count: slices for a synced project in Build, else the phase checklist */
function boardCount(p){
  const si = sliceInfo(p);
  if (p.phase === "build" && si.total) return {d:si.done, t:si.total, label:"slices"};
  const [d, t] = progress(p); return {d, t, label:"checklist"};
}
function lastActivity(p){
  const s = S.syncs[p.id], c = s && s.commits && s.commits[0];
  return Math.max(p.updatedAt || 0, (c && c.at) || 0);
}

/* ---------- Repo files (S16): parsers ---------- */
const SLICE_RE = /^\s*[-*+]\s+\[([ ~xX])\]\s+(S\d+)\b\s*[·:\-–—.]?\s*(.*?)\s*$/;
function parseStories(text){
  const slices = []; let group = "";
  for (const line of String(text || "").split(/\r?\n/)){
    const h = /^#{2,4}\s+(.+?)\s*$/.exec(line);
    if (h){ group = h[1].slice(0, 40); continue; }
    const m = SLICE_RE.exec(line);
    if (m) slices.push({id:m[2], title:m[3].slice(0, 160) || m[2], status:m[1] === "~" ? "check" : m[1] === " " ? "todo" : "done", group, raw:line});
  }

      cur = {date:"", id:"", title:"", built:"", tests:"", check:"", next:"", commit:""};
      if (/^\d{4}-\d{2}-\d{2}$/.test(parts[0])) cur.date = parts.shift();
      if (parts.length > 1) cur.id = parts.shift().slice(0, 20);

    }
    if (!cur) continue;
    const b = /^\s*[-*]\s+([^:]{1,40}):\s*(.*)$/.exec(line);
    if (b){
      const k = b[1].trim().toLowerCase();
      key = k.startsWith("built") ? "built" : k.startsWith("test") ? "tests" : k.startsWith("check") ? "check" : k.startsWith("next") ? "next" : k.startsWith("commit") ? "commit" : null;

    const m = /^[0-9a-f]{40} ([0-9a-f]{40}) .*? (\d{9,11}) [+-]\d{4}\t(.*)$/.exec(line);
    if (!m || !/^commit\b/.test(m[3])) continue;
    const hash = m[1].slice(0, 7); if (seen.has(hash)) continue; seen.add(hash);
    out.push({hash, subject:m[3].replace(/^commit(?: \([^)]*\))?:\s*/, "").slice(0, 140), at:+m[2] * 1000});

}

/* One call for the whole batch (Claude's quick tier). Captures show "Claude is triaging" while it runs. */
async function triage(caps, fresh){
  caps = caps.filter(c => c && !S.triaging.has(c.id));
  if (!caps.length) return;
  const fail = async code => {
    for (const c of caps){ c.triage = {status:"failed", code, at:Date.now()}; S.triaging.delete(c.id); try { await store.put("captures", c.id, c); } catch(e){} }
    softRender();
  };
  if (S.sampleOff) return fail(S.sampleOff);
  if (!S.sample) return fail("unavailable");
  if (!S.online) return fail("offline");
  for (const c of caps){ S.triaging.add(c.id); c.triage = {status:"pending", at:Date.now()}; store.put("captures", c.id, c).catch(() => {}); }
  softRender();
  let out;
  try { out = await S.sample.json(triagePrompt(caps), fresh ? {modelTier:"quick", cache:false} : {modelTier:"quick"}); }
  catch(e){
    const code = (e && e.code) || "upstream_error";
    if (OFF_CODES.includes(code)) S.sampleOff = code;
    return fail(code);
  }
  const list = Array.isArray(out) ? out : out && Array.isArray(out.captures) ? out.captures : [out];
  for (const c of caps){
    const r = list.find(x => x && String(x.id) === c.id) || (caps.length === 1 ? list[0] : null);
    if (!r || typeof r.scores !== "object" || !r.scores) c.triage = {status:"failed", code:"invalid_json", at:Date.now()};

/* The chat as Claude messages: newest 40 (or about 40k characters), alternating, starting with his. */
function coachMessages(p, chat){
  const hist = []; let size = 0, shown = 0;

    const m = chat.messages[i], mt = m.meta || {};
    const content = m.role === "coach" ? (m.text + "\n<studio>" + JSON.stringify({mode:mt.mode || "chat", question:mt.q ? {n:mt.q.n, of:mt.q.of, text:mt.q.text} : null, choices:mt.choices || [], done:!!mt.done}) + "</studio>").trim() : m.text;
    size += content.length; if (size > 40000 && shown) break;
    hist.unshift({role:m.role === "coach" ? "assistant" : "user", content}); shown++;
  }
  while (hist.length && hist[0].role === "assistant") hist.shift();
  const out = [];
  for (const h of hist){ const l = out[out.length - 1]; if (l && l.role === h.role) l.content += "\n\n" + h.content; else out.push({...h}); }
  if (!out.length) out.push({role:"user", content:"Hi."});

  if (done && o.scores && typeof o.scores === "object" && RUBRIC.every(r => +o.scores[r.key] >= 1)){ scores = {}; for (const r of RUBRIC) scores[r.key] = clamp5(o.scores[r.key]); }
  const notes = {};
  if (o.notes && typeof o.notes === "object") for (const [k] of NOTE_KEYS) if (str(o.notes[k], 240)) notes[k] = str(o.notes[k], 240);
  return {mode, reason:mode === "interview" ? str(o.reason, 140) : "", q, choices:mode === "interview" ? choices : [], done, oneliner:done ? str(o.oneliner, 500) : "", scores, notes};
}

/* Light markdown for Claude's replies: paragraphs, line breaks, lists, bold, italics. */
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
function md(t){
  const parts = String(t).trim().split(/```[\w-]*\n?([\s\S]*?)(?:```|$)/);   // odd parts are code blocks
  if (parts.length > 1) return parts.map((x, i) => i % 2 ? (x.trim() ? `<pre><code>${esc(x.replace(/\n$/, ""))}</code></pre>` : "") : x.trim() ? md(x) : "").join("");
  return String(t).trim().split(/\n\s*\n/).map(b => {
    const lines = b.split("\n").filter(l => l.trim());
    if (!lines.length) return "";
    if (lines.every(l => /^\s*([-*•]|\d+[.)])\s+/.test(l))){
      const tag = /^\s*\d/.test(lines[0]) ? "ol" : "ul";
      return `<${tag}>${lines.map(l => `<li>${inl(l.replace(/^\s*([-*•]|\d+[.)])\s+/, ""))}</li>`).join("")}</${tag}>`;
    }
    return `<p>${lines.map(l => inl(l.replace(/^#{1,4}\s+/, ""))).join("<br>")}</p>`;
  }).join("");
}
const liveBody = st => (st.text ? md(st.text) : "") + (!st.text ? `<p class="thinking">Claude is thinking…</p>` : st.raw && st.raw.includes("<studio") ? `<p class="thinking">Finishing the reply…</p>` : "");
function paintLive(pid){
  const el = document.getElementById("coach-live");
  if (!el || el.dataset.pid !== pid) return;
  const near = nearBottom();
  el.querySelector(".body").innerHTML = liveBody(S.coach[pid] || {});
  if (near) scrollChat();
}

function sendCoach(p, text, extra){
  text = String(text || "").trim().slice(0, 4000);
  const pid = p.id, st = S.coach[pid];
  if (!text || (st && st.busy) || (S.chats[pid] && chatBytes(S.chats[pid]) >= CHAT_FULL)) return;
  const c = S.chats[pid] || (S.chats[pid] = emptyChat()), prev = c.messages[c.messages.length - 1];
  if (prev && prev.role === "coach" && prev.meta && prev.meta.q && text.startsWith("Change my answer to \"")) prev.meta.skipped = true;   // a correction, not an answer
  c.messages.push(Object.assign({id:uid("m"), role:"user", text, at:Date.now()}, extra || {}));
  S.drafts[pid] = ""; delete S.coach[pid];
  saveChat(pid);
  S.focusCompose = !isMobile() && !(extra && extra.choice);   // after a choice, number keys stay free for the next one
  askCoach(p);
}
function retryCoach(p){
  const c = S.chats[p.id]; if (!c) return;
  const last = c.messages[c.messages.length - 1];
  if (last && last.role === "coach" && last.meta && last.meta.stopped){ c.messages.pop(); saveChat(p.id); }
  delete S.coach[p.id]; askCoach(p);
}
/* Streams Claude's answer to the last message (Claude's default tier). The reply is saved when it ends. */
async function askCoach(p){
  const pid = p.id, chat = S.chats[pid];
  if (!chat || (S.coach[pid] && S.coach[pid].busy)) return;
  const last = chat.messages[chat.messages.length - 1];
  if (!last || last.role !== "user") return;
  if (!canCoach()){ S.coach[pid] = {err:S.sampleOff || (S.online ? "unavailable" : "offline")}; render(); return; }
  const st = S.coach[pid] = {busy:true, text:"", raw:"", ctrl:new AbortController()};
  render(); scrollChat();
  let raw = "", stopped = false;
  try {
    const r = await S.sample(coachMessages(p, chat), {modelTier:"default", cache:false, signal:st.ctrl.signal,
      onText: ({text}) => { raw = String(text || ""); st.raw = raw; st.text = visibleText(raw); paintLive(pid); }});
    if (r && typeof r.text === "string" && r.text) raw = r.text;
  } catch(e){
    if (st.ctrl.signal.aborted){ stopped = true; if (e && typeof e.text === "string" && e.text.length > raw.length) raw = e.text; }
    else {
      const code = (e && e.code) || "upstream_error";
      if (OFF_CODES.includes(code)) S.sampleOff = code;
      S.coach[pid] = {err:code}; softRender(); return;
    }
  }
  delete S.coach[pid];
  const c = S.chats[pid] || chat, text = visibleText(raw).trim().slice(0, 8000), meta = stopped ? null : readMeta(raw);
  if (!text && !(meta && (meta.q || meta.done))){ S.coach[pid] = stopped ? {stopped:true} : {err:"empty_completion"}; softRender(); return; }
  const m = {id:uid("m"), role:"coach", text, at:Date.now()};
  if (meta){
    const {notes, ...rest} = meta; m.meta = rest;
    for (const [k] of NOTE_KEYS) if (notes[k]) c.notes[k] = notes[k];
    if (meta.mode === "interview") c.free = false;
  } else m.meta = stopped ? {stopped:true} : {mode:"chat"};
  c.messages.push(m); S.chats[pid] = c;
  const near = nearBottom();
  softRender(); if (near) scrollChat();
  saveChat(pid);
}

/* ---------- Storage (artifact db, else this browser) ---------- */
const LKEY = "the-studio-v2";
const local = {
  read(){ try { return JSON.parse(localStorage.getItem(LKEY)) || {projects:{}, captures:{}}; } catch(e){ return {projects:{}, captures:{}}; } },
  write(v){ try { localStorage.setItem(LKEY, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const store = {
  async put(col, id, data){
    const body = JSON.parse(JSON.stringify(data)); delete body.id;
    if (S.backend === "db") return S.db.collection(col).doc(id).set(body);
    const v = local.read(); v[col] = v[col] || {}; v[col][id] = body;
    if (!local.write(v)) throw {code:"local_full"};
    localChanged();
  },
  async del(col, id){
    if (S.backend === "db") return S.db.collection(col).doc(id).delete();
    const v = local.read(); if (v[col]) delete v[col][id]; local.write(v); localChanged();
  }
};
function localChanged(){
  const v = local.read();
  S.projects = Object.entries(v.projects || {}).map(([id, b]) => normalize({...b, id}));
  S.captures = Object.entries(v.captures || {}).map(([id, b]) => ({...b, id}));
  S.syncs = Object.fromEntries(Object.entries(v.syncs || {}));
  S.about = v.settings && v.settings.about ? String(v.settings.about.text || "") : null;
  S.chats = Object.fromEntries(Object.entries(v.chats || {}).map(([id, b]) => [id, normChat(b)]));
  sortAll();
}
/* Render now, unless the person is typing in a field or has a sheet open; then render when they leave it. */
function softRender(){
  const a = document.activeElement;
  if (S.overlay || (a && a.matches && a.matches("[data-field]"))){ S.needRender = true; return; }
  render();
}
function sortAll(){
  S.projects.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  S.captures.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}
function dbErr(e){
  const c = e && e.code;
  if (c === "quota_exceeded") return "Not saved: storage is full.";
  if (c === "invalid_argument" || c === "revoked" || c === "not_granted") return "Not saved: this view can't write.";
  if (c === "local_full") return "Not saved: this browser's storage is full.";
  return "Not saved. Check your connection.";
}
function setStatus(t, bad){ S.statusText = t; S.statusBad = !!bad; document.querySelectorAll("[data-status]").forEach(el => { el.textContent = t; el.classList.toggle("bad", !!bad); }); }

function saveProject(p, now){
  p.updatedAt = Date.now();
  S.dirty.add(p.id);
  clearTimeout(S.saveT[p.id]);
  setStatus("Saving…");
  S.saveT[p.id] = setTimeout(async () => {
    try { await store.put("projects", p.id, p); setStatus(S.backend === "db" ? "Saved" : "Saved in this browser"); }
    catch(e){ setStatus(dbErr(e), true); }
    finally { S.dirty.delete(p.id); }
  }, now ? 0 : 600);
}

let toastT;
function toast(msg){

function readRoute(){

  if (h.startsWith("p-")){ const parts = h.slice(2).split("-"); const ph = PH[parts[parts.length - 1]] ? parts.pop() : null; return {view:"project", id:parts.join("-"), phase:ph}; }
  return {view:"board"};
}

/* After a re-render, put focus back on the same control, so keyboard use survives db updates. */
function focusKey(el){
  if (!el || el === document.body || !el.tagName) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  const a = ["data-act", "data-id", "data-k", "data-v", "data-f", "data-tab", "data-check"].filter(n => el.hasAttribute(n)).map(n => `[${n}="${CSS.escape(el.getAttribute(n))}"]`).join("");
  return a ? el.tagName.toLowerCase() + a : null;
}
function render(){
  const fk = S.overlay ? null : focusKey(document.activeElement);
  const ae = document.activeElement, caret = ae && ae.id === "coach-input" ? [ae.selectionStart, ae.selectionEnd] : null;
  const root = $("#root");
  const r = S.route;
  root.innerHTML = `<div class="app">${rail()}<main>${mtop()}${banners()}${S.backend === "loading" ? loadingView() : r.view === "inbox" ? inboxView() : r.view === "project" ? projectView() : boardView()}</main>${mnav()}</div>${overlayView()}`;
  S.needRender = false;

  const ci = $("#coach-input");
  if (ci){
    grow(ci);
    if (S.focusCompose && !ci.disabled) ci.focus({preventScroll:true});
    if (caret && document.activeElement === ci) ci.setSelectionRange(caret[0], caret[1]);
  }
  S.focusCompose = false;
  const ck = $(".coach .msgs[data-ready]") ? S.route.id : "";   // opening a project's coach shows the latest messages
  if (ck !== S.coachSeen){ S.coachSeen = ck; if (ck) scrollChat(true); }

  setTimeout(ensureChats, 0);
}

function inboxView(){
  const caps = inboxCaps(), r = S.route, mob = isMobile();
  const counts = {all:caps.length, promising:0, park:0, killed:0, none:0};
  for (const c of caps){ const v = capVerdict(c); counts[v || "none"]++; }
  const f = S.ifilter === "none" && !counts.none ? "all" : S.ifilter;
  const shown = caps.filter(c => f === "all" || (f === "none" ? !capVerdict(c) : capVerdict(c) === f));

function capDetail(c){

  const rub = `<section aria-labelledby="rub-h" style="display:flex;flex-direction:column;gap:8px"><div class="sechead" style="margin:0"><h3 id="rub-h">Rubric</h3><span class="mono" style="font-size:14px">${complete(sc) ? sum(sc) : "–"}<span style="color:var(--text3)">/30</span></span></div>

    <span class="vseg" role="group" aria-label="Verdict">${VERDICTS.map(([k, n]) => `<button type="button" data-act="verdict" data-id="${c.id}" data-v="${k}" aria-pressed="${v === k}">${n}</button>`).join("")}</span>
    <span style="font-size:12px;color:var(--text3)">${mineV ? `You set this${auto && auto !== mineV ? `; the scores say ${VNAME[auto]}` : ""}. <button type="button" class="linkbtn" data-act="verdict" data-id="${c.id}" data-v="" style="font-size:12px;color:var(--text2)">Follow the scores</button>`

  const acts = c.status === "promoted"
    ? `<p class="lead" style="margin:0">Promoted. ${proj(c.projectId) ? `<a href="#p-${c.projectId}">Open the project</a>` : ""}</p>`

/* ---------- Discover: coach pane and outputs (S4) ---------- */

function draftCard(m){

function coachMsg(m, isLast, interviewing, st, ok){

function coachPane(p){
  const pid = p.id, st = S.coach[pid] || {}, cs = S.backend === "db" ? S.chatState[pid] : "ready";

    <button type="button" class="btn" data-act="freechat"><span class="desk-only">Back to free chat</span><span class="mob-only">Free chat</span><kbd class="desk-only">Esc</kbd></button></div>` : "";

  if (!n) out += coachIntro(p, ok);
  const answered = k => ms[k] && ms[k].role === "coach" && ms[k].meta && ms[k].meta.q && !ms[k].meta.skipped && ms[k + 1] && ms[k + 1].role === "user";
  for (let i = 0; i < n;){

  const cut = size > CHAT_WARN ? trimCount(chat) : 0;

  return banner + `<div class="msgs" data-ready="1">${out}</div>` + compose;
}

    return head + syncBar(p) + btabs + `<div class="pbody build" data-btab="${snap ? S.buildTab : "slices"}">
      <div class="pmain">${buildMain(p)}</div>
      <aside class="pside" aria-label="Build progress">${logSection(p)}${nextSec}${checkSec}${repoSec(p)}${delSec}</aside></div>`;
  }

  if (viewKey === "discover"){   // S4: the coach is the main view; outputs sit beside it (a tab on a phone)
    const dt = S.dtab === "outputs" ? "outputs" : "coach";
    const dtabs = `<div class="btabs" role="tablist" aria-label="Discover views"><button type="button" role="tab" aria-selected="${dt === "coach"}" data-act="dtab" data-tab="coach">Coach</button><button type="button" role="tab" aria-selected="${dt === "outputs"}" data-act="dtab" data-tab="outputs">Outputs</button></div>`;
    const projSec = `<section><h2>Project</h2><label class="field" for="p-name">Name<input class="input" id="p-name" data-field="name" value="${esc(p.name)}" maxlength="80"></label><div>${delBtn}</div></section>`;
    return head + dtabs + `<div class="pbody coachp" data-dtab="${dt}"><section class="pmain coach" aria-label="Coach">${coachPane(p)}</section>
      <aside class="pside" aria-label="Discover outputs">${discoverAside(p)}${nextSec}${checkSec}${projSec}</aside></div>`;
  }

  return head + `
  <div class="pbody">
    <div class="pmain">
      <p class="goal"><b>${ph.name}:</b> ${esc(ph.goal)}.</p>
      <div class="soon"><b>The coach for ${ph.name} comes in a later slice.</b> For now, use the checklist and keep the next step current; the board shows it under Needs you.</div>
      <div><h2 style="margin:0 0 10px;font-size:16px;font-weight:700">What ${ph.name} produces</h2>
      <ul class="produces">${ph.produces.map(x => `<li><span>${esc(x[0])}</span><span class="mono">${esc(x[1])}</span></li>`).join("")}</ul></div>
      <label class="field" for="p-name">Project name<input class="input" id="p-name" data-field="name" value="${esc(p.name)}" maxlength="80"></label>
      <label class="field" for="p-one">One-liner<textarea class="area" id="p-one" data-field="oneLiner" rows="2" placeholder="For [who], who [struggle], [app] lets them [do what], unlike [current way].">${esc(p.oneLiner)}</textarea></label>
    </div>
    <aside class="pside" aria-label="${ph.name} progress">${nextSec}${checkSec}${delSec}</aside>
  </div>`;
}

/* ---------- Build monitor (S16) ---------- */
const agoText = ts => { const a = ago(ts); return a === "now" ? "just now" : a + " ago"; };
const clip = (s, n) => { s = String(s || ""); s = s.charAt(0).toUpperCase() + s.slice(1); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const LINK = 'class="linkbtn"';

function syncBar(p){
  const snap = S.syncs[p.id], st = S.sync[p.id] || {}, repo = cleanRepo(p.repo);
  if (!repo && !snap) return "";
  const canSync = S.host === "listed" && repo && S.online;
  const busy = st.kind === "reading";
  const btns = `<span class="actions"><button type="button" class="btn ghost" data-act="paste">Paste an update</button>${canSync ? `<button type="button" class="btn" data-act="sync" ${busy ? "disabled" : ""}>${busy ? "Syncing…" : st.kind === "error" ? "Try again" : "Sync now"}</button>` : ""}</span>`;
  const where = snap ? `<span class="mono" style="font-size:12px;color:var(--text2)">${esc(snap.repoName || repoName(snap.repo || repo))}${snap.branch ? " · " + esc(snap.branch) : ""}</span>` : "";
  let cls = "", text;
  if (busy){
    text = Date.now() - st.startedAt > 2500
      ? `<span><b>Connecting to your laptop…</b> The first sync of a session can take about 15 seconds while the file server starts.</span>`
      : `<span><b>Reading your repo…</b></span>`;
  } else if (st.kind === "error"){
    cls = "err";
    text = `<span><b>Couldn't read the repo.</b> ${esc(st.text)}${snap ? ` Showing the snapshot from ${esc(when(snap.at))}.` : ""}${st.missing ? ` <button type="button" ${LINK} data-act="setup">Copy the setup prompt</button>` : ""}</span>`;
  } else if (snap && snap.via === "paste"){
    text = `<span>From a pasted update, <span class="mono">${agoText(snap.at)}</span>.${canSync ? " Sync now reads the repo itself." : ""}</span>${where}`;
  } else if (snap && st.kind === "ok"){
    text = `<span style="display:inline-flex;align-items:center"><i class="dot" style="background:var(--green)"></i><b>Read from your repo</b>&nbsp;<span style="color:var(--text3)">${agoText(snap.at)}</span></span>${where}<span style="color:var(--text3)">via the file server in the Claude app</span>`;
  } else if (snap){
    text = canSync ? `<span>Snapshot from <span class="mono">${esc(when(snap.at))}</span>.</span>${where}`
      : `<span>Snapshot from your laptop, <span class="mono">${agoText(snap.at)}</span>. Live sync runs when The Studio is open in the Claude desktop app there.</span>`;
  } else {
    text = `<span>${S.host === "unknown" ? "Checking for the file server…" : canSync ? "Not synced yet." : "Not synced yet. Sync runs when The Studio is open in the Claude desktop app on your laptop."}</span>`;
  }
  return `<div class="syncbar ${cls}" role="${cls ? "alert" : "status"}"><span class="st">${text}</span>${btns}</div>`;
}

function statusCell(s, nextId, short){
  if (s.status === "done") return `<span class="sst done">${CHECK}Done${s.marked ? ` <small>in The Studio</small>` : ""}</span>`;
  if (s.status === "check") return `<span class="sst check">${short ? "Check" : "Check on your phone"}</span>`;
  if (s.id === nextId) return `<span class="sst" style="color:var(--text)">Next</span>`;
  return `<span class="sst todo">To do</span>`;
}

/* What an open slice row shows: every commit that mentions the slice (git keeps the first line of each message). */
function sliceDetail(s, commits){
  return `<div class="sd">${commits.length
    ? `<ul class="sdc" aria-label="Commits for ${esc(s.id)}">${commits.map(c => `<li><span class="mono h">${esc(c.hash)}</span><span class="mono d">${esc(stamp(c))}</span><span class="m">${esc(c.subject || "Recorded in the progress log")}</span></li>`).join("")}</ul>`
    : `<p class="none">No commits mention ${esc(s.id)} yet.</p>`}</div>`;
}

function buildMain(p){
  const snap = S.syncs[p.id], si = sliceInfo(p), st = S.sync[p.id] || {}, repo = cleanRepo(p.repo);
  const canSync = S.host === "listed" && S.online;
  if (!repo && !snap) return `<section class="slicesec" style="display:flex;flex-direction:column;gap:14px;max-width:720px">
      <p class="goal"><b>Build:</b> ${esc(PH.build.goal)}.</p>
      <div><h2 style="margin:0 0 6px;font-size:16px;font-weight:700">Connect this project to its repo</h2>
      <p class="lead" style="margin:0">The Studio reads <span class="mono">docs/stories.md</span>, <span class="mono">docs/progress.md</span> and your recent commits from the folder, through the file server in the Claude desktop app. Your phone shows the last snapshot.</p></div>
      <label class="field" for="p-repo">Folder on your laptop<input class="input mono" id="p-repo" data-field="repo" value="${esc(p.repo)}" placeholder="C:\\Projects\\my-app" spellcheck="false" autocomplete="off"></label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">${canSync ? `<button type="button" class="btn primary" data-act="sync">Sync now</button>` : `<span style="font-size:13px;color:var(--text3)">Sync runs in the Claude desktop app on your laptop.</span>`}</div>
      <p class="lead" style="margin:0;font-size:13px">No <span class="mono">docs/stories.md</span> in that repo yet? <button type="button" ${LINK} data-act="setup">Copy the setup prompt</button> into Claude Code there. Away from your laptop? <button type="button" ${LINK} data-act="paste">Paste a Studio update</button>.</p>
    </section>`;

  if (!snap){
    if (st.kind === "reading") return `<section class="slicesec" aria-busy="true"><div class="sechead"><h2>Slices</h2></div><div style="border-top:1px solid var(--line)">${[60, 48, 66, 40].map(w => `<div class="skrow" style="grid-template-columns:40px minmax(0,1fr)"><span class="sk" style="width:24px"></span><span><span class="sk" style="width:${w}%"></span></span></div>`).join("")}</div></section>`;
    return `<section class="slicesec" style="max-width:720px"><div class="sechead"><h2>Slices</h2></div>
      <p class="lead">${st.missing ? `To set the repo up, <button type="button" ${LINK} data-act="setup">copy the setup prompt</button> into Claude Code there, then press Try again.`
        : st.kind === "error" ? "Nothing synced yet. Fix the problem above, then press Try again."
        : canSync ? `Press Sync now to read <span class="mono">docs/stories.md</span> from <span class="mono">${esc(repo)}</span>.`
        : "Nothing synced yet. Open The Studio in the Claude desktop app on your laptop and press Sync now, or paste a Studio update."}</p></section>`;
  }

  // Marks made in The Studio that docs/stories.md doesn't show yet
  const pending = Object.keys(snap.marks || {}).filter(id => (snap.slices || []).some(s => s.id === id && s.status !== "done"));
  const notice = pending.length ? `<div class="notice"><span>Marked done in The Studio: <b class="mono">${pending.map(esc).join(", ")}</b>. ${canSync && repo ? "Write it into docs/stories.md so Claude Code sees it." : "It goes into docs/stories.md when you press Write it on your laptop."}</span>${canSync && repo ? `<button type="button" class="btn" data-act="writemarks">Write it</button>` : ""}</div>` : "";

  const checks = si.checks;
  const live = p.liveUrl ? `<a class="btn" href="${esc(p.liveUrl)}" target="_blank" rel="noopener">Open live URL</a>` : "";
  let callout = "";
  if (checks.length === 1){
    const s = checks[0], e = (snap.log || []).find(x => x.id === s.id);
    callout = `<div class="callout"><p><b>${esc(s.id)} is built.</b> Check it on your phone over mobile data, then mark it done.</p>${e && e.check ? `<p class="hint">${esc(clip(e.check, 800))}</p>` : ""}<div class="row">${live}<button type="button" class="btn primary" data-act="markdone" data-id="${esc(s.id)}">Mark ${esc(s.id)} done</button></div></div>`;
  } else if (checks.length > 1){
    callout = `<div class="callout"><p><b>${checks.length} slices are built and waiting for you.</b> Check each on your phone over mobile data, then mark it done.</p>
      <ul>${checks.map(s => `<li><span><span class="mono" style="font-size:12px;color:var(--text2)">${esc(s.id)}</span> ${esc(clip(s.title, 80))}</span><button type="button" class="btn" data-act="markdone" data-id="${esc(s.id)}">Mark done</button></li>`).join("")}</ul>${live ? `<div class="row">${live}</div>` : ""}</div>`;
  }

  const nextId = si.todo && si.todo.id;
  const groups = new Set(si.slices.map(s => s.group)).size > 1;
  let lastGroup = null, rows = "", mrows = "";
  for (const s of si.slices){
    if (groups && s.group !== lastGroup){ lastGroup = s.group; rows += `<tr class="grp"><th colspan="5" scope="colgroup">${esc(s.group || "Other")}</th></tr>`; mrows += `<li class="grp">${esc(s.group || "Other")}</li>`; }
    const c = commitFor(snap, s.id), strong = s.status !== "todo" || s.id === nextId;
    const open = S.open.has(p.id + ":" + s.id), cls = (s.status === "check" ? "hl " : "") + (open ? "open" : "");
    const detail = open ? sliceDetail(s, commitsFor(snap, s.id)) : "";
    rows += `<tr class="srow ${cls}" data-act="slice" data-id="${esc(s.id)}"><th scope="row"><button type="button" class="disc" aria-expanded="${open}" aria-controls="sd-${esc(s.id)}" data-act="slice" data-id="${esc(s.id)}">${CHEV}${esc(s.id)}</button></th>
      <td style="color:${strong ? "var(--text)" : "var(--text2)"}"><span class="ellip" title="${esc(s.title)}">${esc(s.title)}</span></td>
      <td>${statusCell(s, nextId)}</td>
      <td style="font-size:13px">${c ? `<span class="ellip"><span class="mono" style="font-size:12px;color:var(--text3)">${esc(c.hash)}</span> <span style="color:var(--text2)">${esc(c.subject)}</span></span>` : ""}</td>
      <td style="text-align:right;font-family:var(--mono);font-size:12px;color:var(--text3);white-space:nowrap">${esc(stamp(c))}</td></tr>`;
    if (open) rows += `<tr class="sdet ${cls}" id="sd-${esc(s.id)}"><td></td><td colspan="4">${detail}</td></tr>`;
    mrows += `<li class="${cls}"><button type="button" class="mrow" aria-expanded="${open}" data-act="slice" data-id="${esc(s.id)}"><span class="id">${esc(s.id)}</span><span class="mt"><span style="color:${strong ? "var(--text)" : "var(--text2)"}">${esc(open ? s.title : clip(s.title, 90))}</span>${c && !open ? `<span class="mc ellip"><span class="mono">${esc(c.hash)}${c.at ? " · " + esc(stamp(c)) : ""}</span> ${esc(c.subject)}</span>` : ""}</span>${statusCell(s, nextId, true)}${CHEV}</button>${open ? `<div class="msd">${detail}</div>` : ""}</li>`;
  }
  const table = si.total ? `<div class="scroll desk-only"><table class="slices"><colgroup><col style="width:76px"><col style="width:34%"><col style="width:178px"><col><col style="width:112px"></colgroup>
      <thead><tr><th scope="col">ID</th><th scope="col">Story</th><th scope="col">Status</th><th scope="col">Last commit</th><th scope="col" style="text-align:right">Date</th></tr></thead>
      <tbody>${rows}</tbody></table></div><ol class="mslices mob-only">${mrows}</ol>`
    : `<p class="lead">No slice lines in <span class="mono">docs/stories.md</span>. Each slice is one line like <span class="mono">- [ ] S1 · Title</span>.</p>`;

  return `<section class="slicesec" style="display:flex;flex-direction:column;gap:16px" aria-labelledby="slices-h">
    ${notice}${callout}
    <div><div class="sechead"><h2 id="slices-h">Slices <span class="n">from docs/stories.md</span></h2></div>${table}</div>
    <button type="button" class="btn ghost mob-only" data-act="paste" style="height:44px">Paste a Studio update</button>
  </section>`;
}

function logSection(p){
  const snap = S.syncs[p.id];
  if (!snap && !cleanRepo(p.repo)) return "";
  const log = (snap && snap.log) || [];
  const item = e => `<li><span class="h">${e.date ? `<span class="mono" style="font-size:12px;color:var(--text3)">${esc(shortDate(Date.parse(e.date + "T12:00:00")))}</span>` : ""}${e.id ? `<span class="mono" style="font-size:12px;color:var(--text2)">${esc(e.id)}</span>` : ""}<b>${esc(e.title || e.id)}</b></span>${e.built ? `<span class="tx">${esc(clip(e.built, 800))}</span>` : ""}${e.tests ? `<span class="ts">Tests: ${esc(clip(e.tests, 400)).replace(/\b(\d+ passed)\b/i, '<span class="pass">$1</span>')}</span>` : ""}</li>`;
  const body = !snap ? `<p class="lead" style="margin:0">Shows here after the first sync.</p>`
    : log.length ? `<ol class="log">${log.slice(0, 10).map(item).join("")}</ol>${log.length > 10 ? `<span style="font-size:12px;color:var(--text3)">${log.length - 10} older entries in docs/progress.md</span>` : ""}`
    : `<p class="lead" style="margin:0">No entries yet. Claude Code adds one at the end of each slice.</p>`;
  return `<section class="logsec" aria-labelledby="log-h"><h2 id="log-h">Progress log <span class="n mono">docs/progress.md</span></h2>${body}</section>`;
}

function repoSec(p){
  if (!cleanRepo(p.repo) && !S.syncs[p.id]) return "";
  return `<section><h2>Repo</h2>
    <label class="field" for="p-repo2">Folder on your laptop<input class="input mono" id="p-repo2" data-field="repo" value="${esc(p.repo)}" placeholder="C:\\Projects\\my-app" spellcheck="false" autocomplete="off"></label>
    <label class="field" for="p-live">Live URL<input class="input mono" id="p-live" data-field="liveUrl" value="${esc(p.liveUrl)}" placeholder="https://" spellcheck="false" autocomplete="off" inputmode="url"></label>
    <span style="font-size:12px;color:var(--text3)">Setting up a repo for The Studio? <button type="button" ${LINK} data-act="setup">Copy the setup prompt</button></span></section>`;
}

function overlayView(){
  if (!S.overlay) return "";
  if (S.overlay === "capture") return `<div class="scrim" data-act="close"><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="cap-h" id="capForm">
    <div class="row"><h2 id="cap-h">Capture</h2><span class="hint">Saved the moment you press Save</span></div>
    <label class="field" for="cap-text">What's annoying you, or what do you wish existed?<textarea class="area" id="cap-text" rows="4" autofocus required></textarea></label>
    <p class="hint">It lands in your inbox, and Claude scores it against the rubric.</p>
    <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Save capture</button></div></form></div>`;
  if (S.overlay === "newproject") return `<div class="scrim" data-act="close"><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="np-h" id="npForm">
    <h2 id="np-h">New project</h2>
    <label class="field" for="np-name">Working name<input class="input" id="np-name" maxlength="80" autofocus required></label>
    <div class="choice" role="radiogroup" aria-label="Where to start">
      <label><input type="radio" name="start" value="discover" checked><span><b>I need to shape the idea</b><small>Start at Discover.</small></span></label>
      <label><input type="radio" name="start" value="define"><span><b>I know what it is</b><small>Skip to Define with a one-liner.</small></span></label>
    </div>
    <label class="field" for="np-one">One-liner <span style="color:var(--text3)">(optional)</span><textarea class="area" id="np-one" rows="2" placeholder="For [who], who [struggle], [app] lets them [do what], unlike [current way]."></textarea></label>
    <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Create project</button></div></form></div>`;
  if (S.overlay === "keys") return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="k-h">
    <div class="row"><h2 id="k-h">Keyboard shortcuts</h2><button type="button" class="btn ghost" data-act="close" autofocus>Close</button></div>
    <dl class="keys"><dt>C</dt><dd>Capture an idea</dd><dt>B</dt><dd>Board</dd><dt>I</dt><dd>Inbox</dd><dt>1–9</dt><dd>Open the matching item under Needs you</dd><dt>N</dt><dd>New project</dd><dt>S</dt><dd>Sync the repo (in Build)</dd><dt>Enter</dt><dd>Send to the coach (Shift+Enter for a new line)</dd><dt>1–5</dt><dd>Pick an answer in an interview</dd><dt>Esc</dt><dd>Close this panel, or leave an interview for free chat</dd><dt>?</dt><dd>This list</dd></dl></div></div>`;
  if (S.overlay === "about") return `<div class="scrim" data-act="close"><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="ab-h" id="aboutForm">
    <h2 id="ab-h">What Claude knows about you</h2>
    <p class="hint" style="color:var(--text2)">Claude reads this when it scores Learning and Motivation. Say what you want to learn and what you care about.</p>
    <label class="field" for="about-text"><span class="sr">About you</span><textarea class="area" id="about-text" rows="5" maxlength="600" autofocus>${esc(S.about ?? ABOUT_DEFAULT)}</textarea></label>
    <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button></div></form></div>`;
  if (S.overlay === "paste"){
    const x = S.paste;
    if (x && !x.error){
      const words = {check:"built", done:"done", todo:"to do"};
      const sl = x.slices.length ? x.slices.map(s => `${esc(s.id)} ${words[s.status]}`).join(" · ") : "none";
      const t = x.entries[0] && x.entries[0].tests;
      return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pu-h">
        <h2 id="pu-h">Read your Studio update</h2>
        <table class="preview"><tbody>
          <tr><th scope="row">Slices</th><td>${sl}</td></tr>
          <tr><th scope="row">Log entries</th><td>${x.fresh} new${x.entries.length > x.fresh ? `, ${x.entries.length - x.fresh} already in the log` : ""}</td></tr>
          ${t ? `<tr><th scope="row">Tests</th><td style="font-family:var(--body)">${esc(clip(t, 120)).replace(/\b(\d+ passed)\b/i, '<span style="font-family:var(--mono);color:var(--green)">$1</span>')}</td></tr>` : ""}
        </tbody></table>
        <p class="hint">Applying updates the snapshot every device sees. Your next laptop sync replaces it with what's in the repo.</p>
        <div class="foot"><button type="button" class="btn ghost" data-act="pasteback">Back</button><button type="button" class="btn primary" data-act="applypaste" autofocus>Apply update</button></div></div></div>`;
    }
    return `<div class="scrim" data-act="close"><form class="sheet" role="dialog" aria-modal="true" aria-labelledby="pu-h" id="pasteForm">
      <div class="row"><h2 id="pu-h">Paste a Studio update</h2><span class="hint">From the end of a Claude Code session</span></div>
      <label class="field" for="paste-text">Claude Code prints this block when it finishes a slice. Paste all of it.<textarea class="area mono" id="paste-text" rows="8" autofocus required style="font-family:var(--mono);font-size:13px" placeholder="Studio update · my-app&#10;- [~] S3 · Weekly view&#10;## 2026-11-14 · S3 · Weekly view&#10;- Built: …&#10;- Tests: …">${esc((x && x.text) || "")}</textarea></label>
      ${x && x.error ? `<p class="inline-err" role="alert"><b>Couldn't find any slice lines or progress entries in that.</b> Paste the whole block, starting at "Studio update".</p>` : ""}
      <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Read update</button></div></form></div>`;
  }
  if (S.overlay === "setup"){
    const p = proj(S.overlayFor);
    return `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="su-h" style="width:min(760px,100%)">
      <div class="row"><h2 id="su-h">Set up a repo for The Studio</h2><button type="button" class="btn ghost" data-act="close">Close</button></div>
      <p class="hint" style="color:var(--text2)">Paste this into Claude Code in that repo. It writes <span class="mono">docs/stories.md</span>, <span class="mono">docs/progress.md</span>, the protocol in <span class="mono">CLAUDE.md</span> and the Stop hook, then commits.</p>
      <label class="sr" for="setup-text">Setup prompt</label><textarea class="prompt" id="setup-text" readonly>${esc(setupPrompt(p))}</textarea>
      <div class="foot"><button type="button" class="btn primary" data-act="copysetup" autofocus>Copy prompt</button></div></div></div>`;
  }
  return "";
}

problems.length) {\n  let dirty = \"\";\n  try { dirty = git([\"status\", \"--porcelain\", \"--\", \"docs/progress.md\", \"docs/stories.md\"]); } catch (e) {}\n  if (dirty) problems.push(\"docs/progress.md or docs/stories.md has changes that aren't committed\");\n}\nif (!problems.length) process.exit(0);\n\nprocess.stdout.write(JSON.stringify({\n  decision: \"block\",\n  reason: \"Studio protocol: the last commit is \\\"\" + subject + \"\\\", but \" + problems.join(\"; \") + \". \" +\n    \"Before you finish: mark \" + id + \" as [~] in docs/stories.md; add an entry at the top of docs/progress.md \" +\n    \"(## YYYY-MM-DD · \" + id + \" · Title, then Built, Tests, Check on your phone and Next lines); \" +\n    \"commit both as \\\"docs(\" + id + \"): progress log\\\"; then end with the Studio update block from CLAUDE.md.\"\n}));\n", "settings": "{\n  \"hooks\": {\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node\",\n            \"args\": [\"${CLAUDE_PROJECT_DIR}/.claude/hooks/studio-check.cjs\"]\n          }\n        ]\n      }\n    ]\n  }\n}\n", "protocol": "## Studio protocol (every slice)\nThe Studio reads `docs/stories.md`, `docs/progress.md`, `.git/HEAD` and `.git/logs/HEAD` from this folder. Keep the formats exact.\n\n1. Work on one slice from `docs/stories.md` at a time, in the order listed.\n2. When it's built and tested, change its line to `- [~]` (built, check it on a phone). Only Shawn marks `- [x]`; The Studio does it when he presses Mark done.\n3. Add an entry at the top of `docs/progress.md`, under the intro:\n   ```\n   ## YYYY-MM-DD · S# · Title\n   - Built: what changed, in a sentence or two\n   - Tests: what ran and the result, e.g. 31 passed\n   - Check on your phone: what Shawn should try\n   - Next: S# · title of the next slice\n   ```\n4. Commit the code and both docs together as `feat(S#): <title>`. The Studio reads commit hashes from git, so no Commit line is nee /* ---------- Repo sync through the laptop's file server (S16) ---------- */
const HOST = "host:filesystem";
const NO_HOST = ["not_granted", "capability_disabled", "capability_removed"];
function resultText(r){
  if (!r) return "";
  if (typeof r.payload === "string") return r.payload;
  if (r.payload && typeof r.payload.content === "string") return r.payload.content;
  return (r.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}
async function readFile(path, tail){
  const input = tail ? {path, tail} : {path};
  try { return resultText(await S.mcp.callTool(HOST, "read_text_file", input, {cache:false})); }
  catch(e){
    if (!(e && e.retryable)) throw e;           // reads may retry once, after a short random wait
    await new Promise(r => setTimeout(r, Math.min(e.retryAfterMs || 0, 5000) + 500 + Math.random() * 1000));
    return resultText(await S.mcp.callTool(HOST, "read_text_file", input, {cache:false}));
  }
}
function syncError(e, repo){
  const c = e && e.code, msg = String((e && e.message) || "");
  if (c === "tool_error"){
    if (/outside|denied|not allowed|permission/i.test(msg)) return {text:`${repo} is outside the folders the file server can read. Check the folder name.`};
    if (/ENOENT|no such file|not found|cannot find|does not exist/i.test(msg)) return {missing:true, text:`There's no docs/stories.md in ${repo}.`};
    return {text:"The file server said: " + clip(msg, 160)};
  }
  return {text:({
    server_not_connected:"The file server isn't running in the Claude app on this laptop. Check claude_desktop_config.json, then restart the app.",
    not_in_manifest:"Laptop access is off for The Studio. Press Try again and allow it when the Claude app asks.",
    approval_required:"The Claude app needs your OK before The Studio reads the repo. Press Try again to be asked.",
    cancelled:"You declined in the Claude app, so nothing was read.",
    server_unavailable:"The file server didn't answer in time. Try again in a moment.",
    blocked_by_policy:"Your organisation's settings block the file server for this page.",
    needs_reauth:"The file server needs reconnecting in the Claude app."
  })[c] || `Something went wrong reading the repo (${c || "unknown error"}).`};
}

async function syncProject(p, manual){
  const repo = cleanRepo(p.repo);
  if (!repo || !S.mcp || S.host !== "listed") return;
  if ((S.sync[p.id] || {}).kind === "reading") return;
  if (p.repo !== repo){ p.repo = repo; saveProject(p, true); }   // drop quotes from "Copy as path" and trailing slashes
  S.autoDone[p.id] = true;
  S.sync[p.id] = {kind:"reading", startedAt:Date.now()};
  softRender();
  const slow = setTimeout(() => { if ((S.sync[p.id] || {}).kind === "reading") softRender(); }, 2600);
  try {
    const stories = await readFile(joinPath(repo, "docs", "stories.md"));
    const [prog, head, reflog] = await Promise.allSettled([
      readFile(joinPath(repo, "docs", "progress.md")),
      readFile(joinPath(repo, ".git", "HEAD")),
      readFile(joinPath(repo, ".git", "logs", "HEAD"), 80)
    ]);
    const prev = S.syncs[p.id] || {}, slices = parseStories(stories), marks = {};
    for (const [id, at] of Object.entries(prev.marks || {})){ const s = slices.find(x => x.id === id); if (s && s.status !== "done") marks[id] = at; }
    const snap = {
      repo, repoName:repoName(repo), via:"laptop", at:Date.now(), slices, marks,
      branch: head.status === "fulfilled" ? ((/ref:\s*refs\/heads\/(\S+)/.exec(head.value) || [])[1] || "").slice(0, 60) : "",
      log: prog.status === "fulfilled" ? parseProgress(prog.value) : [],
      commits: reflog.status === "fulfilled" ? parseReflog(reflog.value) : []
    };
    S.syncs[p.id] = snap;
    S.sync[p.id] = {kind:"ok", at:Date.now()};
    if (manual) toast(`Synced: ${slices.length} slices, ${snap.log.length} log entries.`);
    try { await store.put("syncs", p.id, snap); } catch(e){ setStatus(dbErr(e), true); }
  } catch(e){
    if (e && NO_HOST.includes(e.code)){ S.host = "none"; S.sync[p.id] = {}; }
    else S.sync[p.id] = {kind:"error", code:e && e.code, ...syncError(e, repo)};
  } finally {
    clearTimeout(slow);
    softRender();
  }
}
function maybeAutoSync(){
  if (S.route.view !== "project" || S.host !== "listed" || !S.online) return;
  const p = proj(S.route.id);
  if (!p || S.autoDone[p.id] || (S.route.phase || p.phase) !== "build") return;
  if (!cleanRepo(p.repo)){ S.autoDone[p.id] = true; return; }   // opening syncs; typing a folder doesn't
  syncProject(p, false);
}

/* Mark done: on the laptop, change [~] to [x] in docs/stories.md (the Claude app asks first).
   Elsewhere, keep the mark in the snapshot until it's written from the laptop. */
async function writeDone(p, ids){
  const repo = cleanRepo(p.repo), path = joinPath(repo, "docs", "stories.md");
  const slices = parseStories(await readFile(path));
  const edits = ids.map(id => slices.find(s => s.id === id)).filter(s => s && s.status !== "done").map(s => ({oldText:s.raw, newText:s.raw.replace(/\[[ ~]\]/, "[x]")}));
  if (edits.length) await S.mcp.callTool(HOST, "edit_file", {path, edits}, {cache:false});
}
async function markDone(p, ids){
  if (S.host === "listed" && cleanRepo(p.repo) && S.online){
    try {
      await writeDone(p, ids);
      toast(`${ids.join(", ")} marked done in docs/stories.md.`);
      await syncProject(p, false);
      return;
    } catch(e){
      if (e && e.code === "cancelled"){ toast("Not changed. You declined in the Claude app."); return; }
      if (e && NO_HOST.includes(e.code)) S.host = "none";
      toast(`Couldn't write docs/stories.md (${(e && e.code) || "error"}). Kept the mark in The Studio.`);
    }
  }
  const snap = S.syncs[p.id]; if (!snap) return;
  snap.marks = {...(snap.marks || {})};
  for (const id of ids) snap.marks[id] = Date.now();
  render();
  try { await store.put("syncs", p.id, snap); if (S.host !== "listed") toast(`${ids.join(", ")} marked done. It goes into docs/stories.md from your laptop.`); }
  catch(e){ toast(dbErr(e)); }
}

function readPaste(text, p){
  const up = parseUpdate(text);
  if (!up.slices.length && !up.entries.length) return {error:true, text};
  const prev = S.syncs[p.id] || {};
  const key = e => [e.date, e.id, e.title].join("|"), have = new Set((prev.log || []).map(key));
  const name = (/Studio update\s*·\s*(\S+)/.exec(text) || [])[1];
  return {text, name, ...up, fresh:up.entries.filter(e => !have.has(key(e))).length};
}
async function applyPaste(p){
  const x = S.paste; if (!x || x.error) return;
  const prev = S.syncs[p.id] || {repo:cleanRepo(p.repo), repoName:x.name || repoName(p.repo), slices:[], log:[], commits:[], marks:{}, branch:""};
  const slices = (prev.slices || []).map(s => ({...s}));
  for (const u of x.slices){
    const s = slices.find(y => y.id === u.id);
    if (s){ s.status = u.status; if (u.title) s.title = u.title; }
    else slices.push({...u, group:slices.length ? slices[slices.length - 1].group : ""});
  }
  const key = e => [e.date, e.id, e.title].join("|"), have = new Set((prev.log || []).map(key));
  const marks = {...(prev.marks || {})};
  for (const id of Object.keys(marks)) if (slices.some(s => s.id === id && s.status === "done")) delete marks[id];
  const snap = {...prev, slices, marks, log:x.entries.filter(e => !have.has(key(e))).concat(prev.log || []).slice(0, 30), via:"paste", at:Date.now()};
  S.syncs[p.id] = snap; S.sync[p.id] = {}; S.paste = null; S.overlay = null; render();
  try { await store.put("syncs", p.id, snap); toast("Update applied."); } catch(e){ toast(dbErr(e)); }
}

async function copyText(text, el){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try { if (el){ el.focus(); el.select(); } if (document.execCommand("copy")) return true; } catch(_){}
    return false;
  }
}

/* ---------- Actions ---------- */
function openOverlay(kind){ S.overlay = kind; render(); }
function closeOverlay(){ S.overlay = null; S.paste = null; render(); }

async function saveCapture(text){
  const id = uid("c");
  const c = {id, text:text.slice(0, 2000), createdAt:Date.now(), device:device(), status:"new"};
  S.captures.unshift(c); S.overlay = null; render();
  try { await store.put("captures", id, c); toast(S.sample && !S.sampleOff && S.online ? "Captured. Claude is triaging it." : "Captured. It's in your inbox."); }
  catch(e){ toast(dbErr(e)); return; }

}
function createProject({name, start, oneLiner, captureId}){
  const id = uid("p");
  const p = normalize({id, name:name || "Untitled project", phase:start, oneLiner:oneLiner || "", createdAt:Date.now(), source:captureId || null});
  if (start === "define") p.completed.discover = true;
  S.projects.unshift(p);
