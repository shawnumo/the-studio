document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act],[data-open]");
  if (!t) return;
  if (t.dataset.open && !ev.target.closest("a,button")){ go("p-" + t.dataset.open); return; }
  const act = t.dataset.act;
  if (act === "close" && ev.target !== t) return;
  const p = S.route.view === "project" ? proj(S.route.id) : null;
  switch (act){
    case "capture": openOverlay("capture"); break;
    case "newproject": openOverlay("newproject"); break;
    case "close": closeOverlay(); break;
    case "promote": {
      const c = S.captures.find(x => x.id === t.dataset.id); if (!c) break;
      const sc = capScores(c);
      const name = (c.triage && c.triage.title) || c.text.split(/\s+/).slice(0, 6).join(" ").replace(/[.,;:]$/, "");
      const np = createProject({name, start:"discover", captureId:c.id});
      if (complete(sc)){
        np.triage = {scores:sc, verdict:capVerdict(c), reasoning:(c.triage && c.triage.reasoning) || "", tags:(c.triage && c.triage.tags) || [], at:Date.now()};
        if (RUBRIC.every(r => sc[r.key] >= 3)) np.checks.discover[2] = true;   // "Score of 3 or more on every rubric row"
        saveProject(np, true);
      }
      c.status = "promoted"; c.projectId = np.id;
      try { await store.put("captures", c.id, c); } catch(e){}
      go("p-" + np.id); toast("Promoted. It starts in Discover.");
      break;
    }
    case "discard": {
      const id = t.dataset.id; S.captures = S.captures.filter(x => x.id !== id);
      if (S.route.cap === id) go("inbox"); else render();
      try { await store.del("captures", id); toast("Discarded."); } catch(e){ toast(dbErr(e)); }
      break;
    }
    case "finish": {
      if (!p) break;
      const key = p.phase, [d, tot] = progress(p, key);
      if (d < tot && !t.dataset.force){ S.confirm = "gate"; render(); break; }
      S.confirm = null; p.completed[key] = true;
      const nx = PHASES[PH[key].n]; if (nx){ p.phase = nx.key; p.nextStep = ""; }
      saveProject(p, true);
      if (nx){ toast(`${PH[key].name} done. On to ${nx.name}.`); go("p-" + p.id); }
      else { toast("Shipped. Start the next loop at Define when feedback is in."); go("board"); }
      break;
    }
    case "cancelgate": S.confirm = null; render(); break;
    case "ifilter": S.ifilter = t.dataset.f; render(); break;
    case "about": openOverlay("about"); break;
    case "triageall": {
      const list = inboxCaps().filter(needsTriage);
      for (let i = 0; i < list.length; i += 8) await triage(list.slice(i, i + 8));   // batches of 8, one after another
      break;
    }
    case "retriage": { const c = S.captures.find(x => x.id === t.dataset.id); if (c){ delete c.you; triage([c], true); } break; }
    case "score": case "verdict": {
      const c = S.captures.find(x => x.id === t.dataset.id); if (!c) break;
      c.you = c.you || {};
      if (act === "score"){
        const k = t.dataset.k, n = +t.dataset.v, mine = c.you.scores || {};
        if (c.triage && c.triage.scores && c.triage.scores[k] === n) delete mine[k]; else mine[k] = n;
        if (Object.keys(mine).length) c.you.scores = mine; else delete c.you.scores;
      } else if (t.dataset.v) c.you.verdict = t.dataset.v; else delete c.you.verdict;
      if (!c.you.scores && !c.you.verdict) delete c.you;
      render();
      if (ev.detail === 0){ const b = [...document.querySelectorAll(`[data-act="${act}"][data-id="${c.id}"]${act === "score" ? `[data-k="${t.dataset.k}"]` : ""}[data-v="${t.dataset.v}"]`)].find(x => x.offsetParent); if (b) b.focus(); }
      try { await store.put("captures", c.id, c); } catch(e){ toast(dbErr(e)); }
      break;
    }
    case "keep": {
      const c = S.captures.find(x => x.id === t.dataset.id); if (!c) break;
      c.status = "kept"; render(); toast("Kept. It stays in the inbox.");
      try { await store.put("captures", c.id, c); } catch(e){ toast(dbErr(e)); }
      break;
    }
    case "jump": {
      if (!p) break; const target = S.route.phase || p.phase, n = PH[target].n;
      for (const x of PHASES){ if (PH[x.key].n < n) p.completed[x.key] = true; else delete p.completed[x.key]; }

    }

    case "change": {
      const m = p && findMsg(p.id, t.dataset.id); if (!m || !m.meta || !m.meta.q) break;
      S.drafts[p.id] = `Change my answer to "${m.meta.q.text}": `; render();
      const ci = $("#coach-input"); if (ci){ ci.focus(); ci.setSelectionRange(ci.value.length, ci.value.length); }
      break;
    }
    case "useone": case "usescores": {
      const m = p && findMsg(p.id, t.dataset.id); if (!m || !m.meta) break;
      if (act === "useone"){
        p.oneLiner = m.meta.oneliner || "";
        if (p.oneLiner && !/\[|\bTBD\b/i.test(p.oneLiner)) p.checks.discover[0] = true;   // "The one-liner is written and every blank is filled"
        m.meta.usedOne = true; toast("One-liner saved to the project.");
      } else {
        const sc = m.meta.scores; if (!sc) break;
        p.triage = {scores:{...sc}, verdict:ruleVerdict(sc), reasoning:"", tags:(p.triage && p.triage.tags) || [], at:Date.now(), from:"coach"};
        p.checks.discover[2] = RUBRIC.every(r => sc[r.key] >= 3);   // "Score of 3 or more on every rubric row"
        m.meta.usedScores = true; toast("Idea score saved to the project.");
      }
      saveProject(p, true); saveChat(p.id); render();
      break;
    }
    case "reopen": { if (!p) break; const key = S.route.phase || p.phase; delete p.completed[key]; p.phase = key; saveProject(p, true); render(); break; }
    case "askdelete": S.confirm = "delete"; render(); break;
    case "delete": {
      if (!p) break; S.projects = S.projects.filter(x => x.id !== p.id); S.confirm = null; go("board");
      try { await store.del("projects", p.id); toast("Project deleted."); } catch(e){ toast(dbErr(e)); }
      if (S.chats[p.id] || S.chatState[p.id] === "ready") store.del("chats", p.id).catch(() => {});
      break;
    }
  }
});

document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.matches("[data-check]")){
    const p = proj(S.route.id); if (!p) return;
    const key = S.route.phase || p.phase;
    p.checks[key][+t.dataset.check] = t.checked;
    if (S.confirm === "gate") S.confirm = null;
    saveProject(p); render();
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "coach-input"){ S.drafts[S.route.id] = t.value; grow(t); return; }
  if (t.matches("[data-field]")){
    const p = proj(S.route.id); if (!p) return;
    p[t.dataset.field] = t.value; saveProject(p);
    if (t.dataset.field === "name"){ const a = document.querySelector(`.plist a[href="#p-${p.id}"] span`); if (a) a.textContent = t.value || "Untitled project"; }
  }
});
document.addEventListener("focusout", ev => {
  if (!(ev.target.matches && ev.target.matches("[data-field]"))) return;
  // Leaving a field for a button: let the button's click do the render, or it would be swapped out mid-click.
  const to = ev.relatedTarget;
  if (to && to.closest && to.closest("[data-act],a[href]")){ S.needRender = true; setTimeout(() => { if (S.needRender && !S.overlay) render(); }, 400); return; }
  setTimeout(() => { if (!document.activeElement || !document.activeElement.matches("[data-field]")) render(); }, 0);
});

document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "coachForm"){ const p = proj(S.route.id), el = $("#coach-input"); if (p && el && el.value.trim()) sendCoach(p, el.value); }
  if (ev.target.id === "capForm"){ const v = $("#cap-text").value.trim(); if (v) saveCapture(v); }
  if (ev.target.id === "npForm"){
    const name = $("#np-name").value.trim(), start = (document.querySelector('input[name="start"]:checked') || {}).value || "discover", one = $("#np-one").value.trim();
    S.overlay = null; const p = createProject({name, start, oneLiner:one}); go("p-" + p.id);
  }
  if (ev.target.id === "aboutForm"){
    const v = $("#about-text").value.trim().slice(0, 600);
    S.about = v; S.overlay = null; render();
    store.put("settings", "about", {text:v}).then(() => toast("Saved. Claude uses it for the next triage."), e => toast(dbErr(e)));
  }
  if (ev.target.id === "pasteForm"){
    const p = proj(S.overlayFor), v = $("#paste-text").value;
    if (p && v.trim()){ S.paste = readPaste(v, p); render(); }
  }
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && S.overlay){ closeOverlay(); return; }
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey) && ev.target.id === "cap-text"){ ev.preventDefault(); $("#capForm").requestSubmit(); return; }
  if (ev.key === "Enter" && ev.target.id === "coach-input" && !ev.shiftKey && !ev.isComposing && !isMobile()){ ev.preventDefault(); $("#coachForm").requestSubmit(); return; }
  if (ev.key === "Escape" && !S.overlay){ const b = $('.ibar [data-act="freechat"]'); if (b){ ev.preventDefault(); b.click(); return; } }
  const typing = ev.target.closest && ev.target.closest("input,textarea,select,[contenteditable]");
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey || S.overlay) return;
  const k = ev.key.toLowerCase();
  if (k === "c"){ ev.preventDefault(); openOverlay("capture"); }
  else if (k === "n"){ ev.preventDefault(); openOverlay("newproject"); }
  else if (k === "b") go("board");
  else if (k === "i") go("inbox");
  else if (ev.key === "?"){ openOverlay("keys"); }
  else if (k === "s" && S.route.view === "project"){ const p = proj(S.route.id); if (p && (S.route.phase || p.phase) === "build") syncProject(p, true); }
  else if (/^[1-9]$/.test(k) && S.route.view === "board"){ const p = active()[+k - 1]; if (p) go("p-" + p.id); }
  else if (/^[1-9]$/.test(k) && S.route.view === "project"){ const b = [...document.querySelectorAll(`.choices [data-act="choose"][data-i="${+k - 1}"]`)].find(x => x.offsetParent); if (b && !b.disabled){ ev.preventDefault(); b.click(); } }
});

window.addEventListener("online", () => { S.online = true; render(); });
window.addEventListener("offline", () => { S.online = false; render(); });

/* ---------- Boot ---------- */
function use(name){
  try { return (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
  catch(e){ return Promise.resolve(null); }
}
function startLocal(note){ S.backend = "local"; S.loadNote = note; localChanged(); render(); }

function subscribe(col, apply){
  return new Promise(resolve => {
    let first = true;
    S.db.collection(col).onSnapshot(snap => {
      const list = snap.docs.filter(d => d.exists).map(d => ({...JSON.parse(JSON.stringify(d.data() || {})), id:d.id}));
      apply(list, snap.metadata);
      if (first){ first = false; resolve(snap.metadata); }
      else softRender();
    }, err => { if (first){ first = false; resolve({error:err}); } else setStatus("Lost the connection to your data. Reload to reconnect.", true); });
  });
}

/* Is the laptop's file server reachable? Only inside the Claude desktop app, for the owner. */
async function detectHost(){
  const m = await use("mcp");
  S.mcp = m;
  if (!m){ S.host = "none"; softRender(); return; }
  try {
    const r = await m.listTools(HOST);
    S.host = (r.servers || []).some(s => s.server === HOST && (s.tools || []).length) ? "listed" : "none";
  } catch(e){ S.host = "none"; }
  softRender();
}

async function boot(){
  S.route = readRoute();
  render();
  detectHost();
  use("sample").then(s => { S.sample = s; softRender(); });
  if (window.matchMedia) matchMedia("(max-width: 820px)").addEventListener("change", () => softRender());
  const db = await use("db");
  if (!db){ startLocal("Open The Studio on claude.ai while signed in to save to your account."); return; }
  S.db = db;
  const timer = setTimeout(() => { if (S.backend === "loading"){ S.loadNote = "Check your connection. The Studio keeps trying."; render(); } }, 10000);
  const [a] = await Promise.all([
    subscribe("projects", list => { const keep = new Map(S.projects.map(p => [p.id, p])); S.projects = list.map(p => S.dirty.has(p.id) && keep.get(p.id) ? keep.get(p.id) : normalize(p)); for (const p of keep.values()) if (S.dirty.has(p.id) && !S.projects.some(x => x.id === p.id)) S.projects.push(p); sortAll(); }),
    subscribe("captures", list => { S.captures = list; sortAll(); }),
    subscribe("syncs", list => { S.syncs = Object.fromEntries(list.map(s => [s.id, s])); }),
    subscribe("settings", list => { const a = list.find(x => x.id === "about"); S.about = a ? String(a.text || "") : null; })
  ]);
  clearTimeout(timer);
  if (a && a.error){ startLocal("Couldn't reach your saved data, so this session saves in this browser only."); return; }
  S.backend = "db";
  render();
}
boot();
</script>
