/* ---------- Board (S1) ---------- */
/* Drafts waiting on you. Each project record carries a small summary of its drafts (no text), so the board needn't load
   every document: it's written when a draft lands, changes or ends, and checked against the documents whenever they load.
   Where a project's documents are already loaded (or everything is in this browser), the board reads them directly. */
const DLABEL = {prd:"PRD", stories:"user stories", nfrs:"NFRs", architecture:"architecture"};
const docLabel = d => d.kind === "adr" ? `ADR ${adrInfo(d).num}` : DLABEL[d.key] || String(d.key || "document");
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const andList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
function draftEntry(d){
  if (!d || !d.draft || typeof d.draft.text !== "string") return null;
  const phase = d.kind === "adr" ? "design" : PH[d.phase] && docDef(d.phase, d.key) ? d.phase : (Object.keys(DOCS).find(ph => docDef(ph, d.key)) || "define");
  const e = {id:d.id, key:d.kind === "adr" ? "adr" : d.key, phase, name:docLabel(d), at:+d.draft.at || 0, review:hasText(d), n:0, left:0};
  if (e.review){ const c = reviewCounts(d); e.n = c.n; e.left = c.left; if (S.docs[d.id] !== d) delete S.rv[d.id]; }   // a copy read for the summary isn't kept
  return e;
}
const sumOf = docs => Object.fromEntries(docs.map(draftEntry).filter(Boolean).map(({id, ...e}) => [id, e]));
const sumKey = s => JSON.stringify(Object.keys(s || {}).sort().map(k => { const e = s[k] || {}; return [k, e.key, e.phase, e.name, e.at, e.review, e.n, e.left]; }));
function setSum(p, sum){
  if (!p || sumKey(p.drafts) === sumKey(sum)) return;
  p.drafts = sum; saveProject(p); softRender();
}
/* One document's draft changed: update its line of the summary a moment after the last change. */
function noteDraft(id){
  const pid = String(id).split("~")[0], p = proj(pid), d = S.docs[id];
  if (!p || (!(d && d.draft) && !(p.drafts && p.drafts[id]))) return;
  clearTimeout(S.dsumT[id]);
  S.dsumT[id] = setTimeout(() => {
    const q = proj(pid); if (!q) return;
    const e = draftEntry(S.docs[id]), sum = {...q.drafts};
    if (e){ const {id:_, ...rest} = e; sum[id] = rest; } else delete sum[id];
    setSum(q, sum);
  }, 300);
}
/* A project's documents are loaded: make its summary match them. */
function queueSum(pid){
  clearTimeout(S.sumT[pid]);
  S.sumT[pid] = setTimeout(() => {
    const p = proj(pid); if (!p || S.docState[pid] !== "ready") return;
    setSum(p, sumOf(Object.values(S.docs).filter(d => d.pid === pid)));
  }, 500);
}
/* Once per account: drafts made before S1 aren't in any summary yet, so read each project's documents once, after the board is up. */
async function backfillDrafts(){
  if (S.backend !== "db" || S.bfDone || (S.boardSet && S.boardSet.drafts)) return;
  S.bfDone = true;
  try {
    for (const p of S.projects.slice()){
      if (S.docState[p.id] === "ready") continue;   // already loaded: queueSum keeps it right
      const snap = await S.db.collection("docs").where("pid", "==", p.id).get();
      setSum(proj(p.id), sumOf(snap.docs.filter(s => s.exists).map(s => normDoc({...JSON.parse(JSON.stringify(s.data() || {})), id:s.id}))));
    }
    await store.put("settings", "board", {drafts:1, at:Date.now()});
  } catch(e){}   // tried again the next time The Studio opens
}
function draftsOf(p){
  const live = S.backend === "local" || S.docState[p.id] === "ready";
  const list = live ? Object.values(S.docs).filter(d => d.pid === p.id && d.draft).map(draftEntry)
    : Object.entries(p.drafts || {}).map(([id, e]) => e && typeof e === "object" ? {...e, id} : null);
  return list.filter(e => e && PH[e.phase] && e.key).sort((a, b) => (a.at || 0) - (b.at || 0));
}
/* Opening a draft from the board: its phase, its document tab, and the Changes tab on a laptop. */
function prepReview(id){
  const pid = String(id).split("~")[0], p = proj(pid), e = p && draftsOf(p).find(x => x.id === id);
  if (!e) return p ? "p-" + p.id : "board";
  if (e.key === "adr"){ S.doctab[pid + e.phase] = "adr"; S.adrOpen[pid] = id; } else S.doctab[pid + e.phase] = e.key;
  S.pendFtab = e.review && !isMobile() ? "changes" : "doc";
  return `p-${pid}-${e.phase}`;
}
/* The board's next step for a project: a waiting draft comes before anything else. */
function boardNext(p){
  const ds = draftsOf(p);
  if (!ds.length) return nextText(p);
  return ds.length > 1 ? `${ds.length} drafts to review` : cap1(`${ds[0].name} draft to review`);
}
/* One Needs you item per project. g orders the list: drafts, then slices waiting on a phone check, then the rest. */
function needOf(p){
  const ds = draftsOf(p), t = lastActivity(p);
  if (ds.length){
    const d = ds[0], ph = d.phase;
    let text, info, btn = "Start review";
    if (ds.length > 1){ text = `Review ${ds.length} drafts Claude wrote`; info = andList(ds.map(x => x.name)); }
    else if (!d.review){ text = `Read the ${d.name} draft Claude wrote`; info = "new document"; btn = "Read draft"; }
    else if (d.left < d.n){ text = `Finish reviewing the ${d.name} draft`; info = d.left ? `${d.left} of ${d.n} changes left` : `all ${d.n} changes decided`; btn = "Continue review"; }
    else { text = `Review the ${d.name} draft Claude wrote`; info = d.n ? `${d.n} tracked change${d.n === 1 ? "" : "s"}` : "no changes"; }
    return {p, g:0, t, text, btn, rid:d.id, href:`#p-${p.id}-${ph}`, meta:`${esc(p.name)} · ${PH[ph].name} · <span class="cl">${esc(info)}</span>`};
  }
  const c = boardCount(p), busy = Object.keys(S.drafting).find(k => k.startsWith(p.id + "~") && S.drafting[k].busy && S.docs[k]);
  return {p, g:p.phase === "build" && sliceInfo(p).checks.length ? 1 : 2, t, text:nextText(p), btn:"Start", rid:"", href:`#p-${p.id}`,
    meta:`${esc(p.name)} · ${PH[p.phase].name} · ${c.label} <span class="mono">${c.d}/${c.t}</span>${busy ? ` · <span class="cl">Claude is drafting the ${esc(docLabel(S.docs[busy]))}…</span>` : ""}`};
}

/* The last Claude Code session on a project row: the newest progress.md entry from the last repo sync or pasted update,
   timed by its slice's commit when that commit is from the same day or later. */
function lastSession(p){
  const snap = S.syncs[p.id];
  if (!snap) return cleanRepo(p.repo) ? {state:"unsynced"} : null;
  const e = (snap.log || [])[0];
  if (!e) return {state:"nolog"};
  const id = /^S\d+[a-z]?$/i.test(e.id) ? e.id : "", c = id ? commitFor(snap, id) : null;
  const day = /^\d{4}-\d{2}-\d{2}$/.test(e.date) ? Date.parse(e.date + "T00:00:00") : 0;
  const timed = !!(c && c.at && !c.dateOnly && (!day || c.at >= day));
  return {state:"ok", id, title:e.title || e.id || "", at:timed ? c.at : day || (c && c.at) || 0, timed};
}
function dayWhen(ts, timed){
  const d = new Date(ts), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  const t = timed ? " " + d.toLocaleTimeString(undefined, {hour:"2-digit", minute:"2-digit", hour12:false}) : "";
  if (d.toDateString() === now.toDateString()) return "today" + t;
  if (d.toDateString() === y.toDateString()) return "yesterday" + t;
  if (now - d > 0 && now - d < 6 * 86400000) return d.toLocaleDateString(undefined, {weekday:"short"}) + t;
  return shortDate(ts) + t;
}
function sessLine(p){
  const s = lastSession(p); if (!s) return "";
  if (s.state === "unsynced") return `<span class="sess">Claude Code · not synced yet</span>`;
  if (s.state === "nolog") return `<span class="sess">Claude Code · no sessions logged yet</span>`;
  const w = s.at ? dayWhen(s.at, s.timed) : "", title = s.title.length > 32 ? s.title.slice(0, 31) + "…" : s.title;
  const label = `Last Claude Code session: ${s.id ? s.id + " · " : ""}${s.title}${w ? ", " + w : ""}`;
  return `<span class="sess" title="${esc(label)}">Claude Code · ${s.id ? `<span class="mono">${esc(s.id)}</span>` : esc(title)}${w ? ` · <span class="mono">${esc(w)}</span>` : ""}</span>`;
}

function capDetail(c){

  const st = triageState(c), sc = capScores(c), v = capVerdict(c), t = c.triage || {};
  const canAsk = S.sample && !S.sampleOff && S.online;
  let ai;
  if (st === "pending") ai = `<section class="ai" aria-busy="true"><h3>Claude's triage</h3><p>Scoring this capture against the rubric…</p></section>`;
  else if (st === "done") ai = `<section class="ai" aria-labelledby="ai-h"><h3 id="ai-h">Claude's triage${canAsk ? `<button type="button" class="linkbtn" data-act="retriage" data-id="${c.id}">Ask again</button>` : ""}</h3><p>${esc(t.reasoning || "")}</p>${t.tags && t.tags.length ? `<span class="tags">Tags: ${t.tags.map(esc).join(", ")}</span>` : ""}</section>`;
  else if (st === "failed") ai = `<section class="errbox" role="alert"><span><b>Claude couldn't triage this.</b> ${esc(triageErr(t.code))}</span>${canAsk ? `<button type="button" class="btn" data-act="retriage" data-id="${c.id}">Try again</button>` : ""}</section>`;
  else ai = `<section class="notice" style="flex-direction:column;align-items:flex-start"><span><b>Not triaged yet.</b> ${canAsk ? "Claude hasn't scored this capture." : esc(triageErr(S.sampleOff || (S.online ? "unavailable" : "offline")))}</span>${canAsk ? `<button type="button" class="btn" data-act="retriage" data-id="${c.id}">Ask Claude to triage it</button>` : ""}</section>`;

  const was = t.scores || {}, mine = (c.you && c.you.scores) || {};

/* ---------- Discover: coach pane and outputs (S4) ---------- */
function docCoachIntro(phase, ok){

}
function coachIntro(p, ok, phase = "discover"){

    `<div class="msg cl"><span class="who">Claude</span><div class="body"><p>I'm your Discover coach. Together we'll find out whether this idea is worth two weeks, and end with a one-liner and an honest idea score.</p>
    <p>${cap ? `I've read your capture${p.triage ? " and the inbox triage" : ""}. ` : ""}Tell me about it in your own words, or I can interview you: a few quick questions, most with answers you can tap.</p></div>
    ${ok ? `<div class="acts"><button type="button" class="btn" data-act="interview">Interview me</button></div>` : ""}</div>`;
}
function draftCard(m){

  const scr = sc ? `<div class="dr"><span class="lbl">Idea score <span class="mono">${sum(sc)}/30</span> · ${VNAME[v]}</span><span class="tags">${RUBRIC.map(r => `${r.name} <span class="mono">${sc[r.key]}</span>`).join(" · ")}</span>${mt.usedScores ? used : `<button type="button" class="btn" data-act="usescores" data-id="${m.id}">Use these scores</button>`}</div>` : "";
  return `<section class="ai draft" aria-label="Claude's draft"><h3>Claude's draft</h3>${one}${scr}${(mt.oneliner && !mt.usedOne) || (sc && !mt.usedScores) ? `<span class="tags">Nothing changes until you use it, and you can still edit it afterwards.</span>` : ""}</section>`;
}
function coachMsg(m, isLast, interviewing, st, ok){
  const mt = m.meta || {}, ask = isLast && interviewing && (mt.q || (mt.choices && mt.choices.length));
  const qText = mt.q && !ask ? `<p>${esc(mt.q.text)}</p>` : "";

function coachPane(p){

    const wait = cs === "error" ? `<div class="errbox" role="alert"><span><b>This chat can't be loaded.</b> Reload The Studio to try again.</span></div>`

  }

  const interviewing = !chat.free && lm.mode === "interview";

    <button type="button" class="btn" data-act="freechat"><span class="desk-only">Back to free chat</span><span class="mob-only">Free chat</span><kbd class="desk-only">Esc</kbd></button></div>` : "";

  let out = "";

  if (!n) out += coachIntro(p, ok, phase);
  const answered = k => ms[k] && ms[k].role === "coach" && ms[k].meta && ms[k].meta.q && !ms[k].meta.skipped && ms[k + 1] && ms[k + 1].role === "user";
  let offerAt = -1; for (let k = n - 1; k >= 0; k--) if (ms[k].role === "coach" && ms[k].meta && ms[k].meta.ready && ms[k].meta.ready.length){ offerAt = k; break; }
  for (let i = 0; i < n;){
    if (answered(i)){   // answered interview questions collapse into one list
      if (ms[i].text && !(i >= 2 && answered(i - 2))) out += coachMsg({...ms[i], meta:{...ms[i].meta, q:null}}, false, false, st, ok);
      let rows = "";
      for (; answered(i); i += 2){ const q = ms[i].meta.q; rows += `<div><dt>${q.n}. ${esc(q.text)}</dt><dd><span>${esc(ms[i + 1].text)}</span><button type="button" class="linkbtn" data-act="change" data-id="${ms[i].id}" ${ok && !full && !st.busy ? "" : "disabled"}>Change</button></dd></div>`; }
      out += `<dl class="qa">${rows}</dl>`;
      continue;
    }
    const mi = i !== offerAt && ms[i].meta && ms[i].meta.ready ? {...ms[i], meta:{...ms[i].meta, ready:null}} : ms[i];   // only the latest offer to draft shows
    out += ms[i].role === "user" ? `<p class="msg me">${esc(ms[i].text)}</p>` : coachMsg(mi, i === n - 1, interviewing, st, ok && !full);

  if (!ok && !st.err) out += `<div class="notice" role="status"><span><b>The coach is off here.</b> ${esc(coachErr(S.sampleOff || (S.online ? "unavailable" : "offline")))}</span></div>`;

  const cut = size > CHAT_WARN ? trimCount(chat) : 0;
  const trimAsk = cut && (full || !S.trimLater[pid]) ? `<div class="notice trimask" role="status"><span><b>${full ? "This chat is full." : "This chat is getting full."}</b> It uses ${Math.round(size / 1024)} KB of the 256 KB a saved chat can hold. ${full ? `Trim the ${cut} oldest messages to keep chatting.` : `Trim the ${cut} oldest messages?`} Claude's notes keep what they said, and Claude only reads the latest messages anyway.</span>
    <span class="row"><button type="button" class="btn" data-act="trimchat" ${st.busy ? "disabled" : ""}>Trim ${cut} messages</button>${full ? "" : `<button type="button" class="btn ghost" data-act="trimlater">Not now</button>`}</span></div>` : "";

  return banner + `<div class="msgs" data-ready="1">${out}</div>` + compose;

function discoverAside(p){

/* The phase's coach chat as plain text, newest kept when it's long. */

  const sl = lines.find(l => /^\s*\**status\**\s*:/i.test(l)) || "";

  const num = String(d.n || 0).padStart(4, "0"), slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50) || "untitled";
  return {key:d.key, name:`ADR ${num}`, num, title, status, path:`docs/adr/${num}-${slug}.md`, adr:true};
}

/* Import a document from the repo through the laptop's file server (read only; the repo isn't changed). */
async function importDoc(){
  const x = S.imp, p = x && proj(x.pid), def = p && docDef(x.phase, x.key);
  if (!def || x.state === "reading") return;
  const el = $("#imp-repo"); x.folder = el ? el.value : x.folder;
  const repo = cleanRepo(x.folder);
  if (!repo){ x.err = "Type the project's folder, like C:\\Projects\\my-app."; render(); return; }
  if (!S.mcp || S.host !== "listed"){ x.err = "The file server can't be reached from here. Open The Studio in the Claude desktop app on your laptop."; render(); return; }
  x.state = "reading"; x.err = ""; x.slow = false; render();
  const slow = setTimeout(() => { if (S.imp === x && x.state === "reading"){ x.slow = true; render(); } }, 2600);
  try {
    const text = String(await readFile(joinPath(repo, ...def.path.split("/")))).replace(/\r\n?/g, "\n");
    if (text.length > DOC_MAX) throw {code:"too_long"};
    if (p.repo !== repo){ p.repo = repo; saveProject(p, true); }
    const d = docRec(p.id, x.phase, def.key);
    d.text = text; d.imported = {path:def.path, at:Date.now()};
    S.editing = null; saveDoc(d, true, true);
    if (S.imp === x){ S.imp = null; S.overlay = null; }
    render(); toast(`Imported ${def.path}: ${text.length.toLocaleString()} characters.`);
  } catch(e){
    if (e && NO_HOST.includes(e.code)) S.host = "none";
    if (S.imp !== x) return;
    x.state = "idle"; x.slow = false;
    x.err = e && e.code === "too_long" ? `${def.path} is too long to keep in The Studio (over ${DOC_MAX.toLocaleString()} characters).` : importError(e, repo, def.path);
    render();
  } finally { clearTimeout(slow); }
}
function importError(e, repo, path){
  const msg = String((e && e.message) || "");
  if (e && e.code === "tool_error" && /ENOENT|no such file|not found|cannot find|does not exist/i.test(msg)) return `There's no ${path} in ${repo}.`;
  return syncError(e, repo).text;
}

/* Markdown for documents: headings, paragraphs, nested lists with task boxes, tables, code, quotes, rules and links. Text is escaped first. */
function mdInline(s){
  const code = [];
  let t = esc(s).replace(/`([^`]+)`/g, (_, c) => { code.push(c); return "\u0000" + (code.length - 1) + "\u0000"; });
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => { const u = url.replace(/&amp;/g, "&"); return /^(https?:\/\/|mailto:)/i.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${txt}</a>` : txt; });
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/__(.+?)__/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>").replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/~~(.+?)~~/g, "<del>$1</del>");
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${code[+i]}</code>`);
}
const MD = {fence:/^\s{0,3}(```|~~~)\s*([\w+-]*)/, head:/^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/, hr:/^\s{0,3}([-*_])(\s*\1){2,}\s*$/, li:/^(\s*)([-*+]|\d+[.)])\s+(.*)$/, quote:/^\s{0,3}>/, tsep:/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/};
function mdList(lines){
  const items = [];
  for (const raw of lines){
    if (!raw.trim()) continue;
    const m = /^(\s*)([-*+]|(\d+)[.)])\s+(.*)$/.exec(raw);
    if (m) items.push({ind:m[1].replace(/\t/g, "    ").length, ord:!!m[3], start:+m[3] || 1, text:m[4]});
    else if (items.length) items[items.length - 1].text += "\n" + raw.trim();   // a line under an item stays with it, on its own line
  }
  let k = 0;
  const item = t => {
    const m = /^\[([ xX~])\]\s+([\s\S]*)$/.exec(t);
    const lines = s => s.split("\n").map(mdInline).join("<br>");
    if (!m) return `<li>${lines(t)}`;
    const c = m[1] === " " ? ["", "To do"] : m[1] === "~" ? [" w", "Built, to check"] : [" x", "Done"];
    return `<li class="task"><span class="tb${c[0]}" role="img" aria-label="${c[1]}"></span>${lines(m[2])}`;
  };
  const build = base => {
    const first = items[k], tag = first.ord ? "ol" : "ul";
    let h = `<${tag}${first.ord && first.start !== 1 ? ` start="${first.start}"` : ""}>`;
    while (k < items.length && items[k].ind >= base){
      const it = items[k++];
      h += item(it.text);
      if (k < items.length && items[k].ind > it.ind) h += build(items[k].ind);
      h += "</li>";
    }
    return h + `</${tag}>`;
  };
  let out = "";
  while (k < items.length) out += build(items[k].ind);
  return out;
}
function mdDoc(src){
  const L = String(src || "").replace(/\r\n?/g, "\n").split("\n"), blank = l => !l.trim();
  let i = 0, out = "", m;
  while (i < L.length){
    const l = L[i];
    if (blank(l)){ i++; continue; }
    if ((m = MD.fence.exec(l))){
      const end = new RegExp("^\\s{0,3}" + m[1]), buf = []; i++;
      while (i < L.length && !end.test(L[i])) buf.push(L[i++]);
      i++;
      out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`;
      continue;
    }
    if ((m = MD.head.exec(l))){ out += `<h${m[1].length}>${mdInline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (MD.hr.test(l)){ out += "<hr>"; i++; continue; }
    if (MD.quote.test(l)){
      const buf = []; while (i < L.length && MD.quote.test(L[i])) buf.push(L[i++].replace(/^\s{0,3}>\s?/, ""));
      out += `<blockquote>${mdDoc(buf.join("\n"))}</blockquote>`;
      continue;
    }
    if (l.includes("|") && i + 1 < L.length && L[i + 1].includes("|") && MD.tsep.test(L[i + 1])){
      const cells = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
      const hd = cells(l), rows = []; i += 2;
      while (i < L.length && L[i].includes("|") && !blank(L[i])) rows.push(cells(L[i++]));
      out += `<div class="tbl"><table><thead><tr>${hd.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${hd.map((_, j) => `<td>${mdInline(r[j] || "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if (MD.li.test(l)){
      const buf = [];
      while (i < L.length && (MD.li.test(L[i]) || (!blank(L[i]) && /^\s+\S/.test(L[i])) || (blank(L[i]) && i + 1 < L.length && MD.li.test(L[i + 1])))) buf.push(L[i++]);
      out += mdList(buf);
      continue;
    }
    const buf = [];
    while (i < L.length && !blank(L[i]) && !MD.fence.test(L[i]) && !MD.head.test(L[i]) && !MD.hr.test(L[i]) && !MD.quote.test(L[i]) && !(buf.length && MD.li.test(L[i]))) buf.push(L[i++]);
    if (!buf.length) buf.push(L[i++]);
    out += `<p>${buf.map(x => mdInline(x.trim())).join(" ")}</p>`;
  }
  return out;
}

function statusCell(s, nextId, short){

/* ---------- Setup prompt for other repos (S16) ---------- */
const SETUP = /*SETUP_JSON*/{"hook": "#!/usr/bin/env node\n// The Studio protocol check, run by Claude Code as a Stop hook.\n// When the latest commit finishes a slice (\"feat(S#): ...\"), Claude can't end\n// its turn until docs/progress.md has an entry for that slice, docs/stories.md\n// no longer shows it as to do, and both files are committed.\n// Plain Node, no packages. Works on Windows, macOS and Linux.\n\"use strict\";\nconst fs = require(\"fs\");\nconst path = require(\"path\");\nconst { execFileSync } = require(\"child_process\");\n\nlet input = {};\ntry { input = JSON.parse(fs.readFileSync(0, \"utf8\") || \"{}\"); } catch (e) {}\nif (input.stop_hook_active) process.exit(0); // already blocked once this turn: let Claude stop\n\nconst root = process.env.CLAUDE_PROJECT_DIR || input.cwd || process.cwd();\nconst git = args => execFileSync(\"git\", args, { cwd: root, encoding: \"utf8\", stdio: [\"ignore\", \"pipe\", \"ignore\"] }).trim();\nconst read = file => { try { return fs.readFileSync(path.join(root, file), \"utf8\"); } catch (e) { return null; } };\n\nlet subject = \"\";\ntry { subject = git([\"log\", \"-1\", \"--format=%s\"]); } catch (e) { process.exit(0); } // not a repo, or no commits yet\nconst m = /^feat\\((S\\d+)\\)/.exec(subject);\nif (!m) process.exit(0);\nconst id = m[1];\nconst idRe = new RegExp(\"\\\\b\" + id + \"\\\\b\");\n\nconst problems = [];\nconst progress = read(\"docs/progress.md\");\nif (progress === null) problems.push(\"docs/progress.md doesn't exist\");\nelse {\n  const newest = progress.split(/\\r?\\n/).find(line => /^##\\s/.test(line)) || \"\";\n  if (!idRe.test(newest)) problems.push(\"the newest entry in docs/progress.md isn't for \" + id);\n}\nconst stories = read(\"docs/stories.md\");\nif (stories !== null) {\n  const line = stories.split(/\\r?\\n/).find(l => /^\\s*[-*+]\\s+\\[[ ~xX]\\]\\s+S\\d+/.test(l) && idRe.test(l));\n  if (line && /\\[ \\]/.test(line)) problems.push(id + \" is still [ ] in docs/stories.md\");\n}\nif (!problems.length) {\n  let dirty = \"\";\n  try { dirty = git([\"status\", \"--porcelain\", \"--\", \"docs/progress.md\", \"docs/stories.md\"]); } catch (e) {}\n  if (dirty) problems.push(\"docs/progress.md or docs/stories.md has changes that aren't committed\");\n}\nif (!problems.length) process.exit(0);\n\nprocess.stdout.write(JSON.stringify({\n  decision: \"block\",\n  reason: \"Studio protocol: the last commit is \\\"\" + subject + \"\\\", but \" + problems.join(\"; \") + \". \" +\n    \"Before you finish: mark \" + id + \" as [~] in docs/stories.md; add an entry at the top of docs/progress.md \" +\n    \"(## YYYY-MM-DD · \" + id + \" · Title, then Built, Tests, Check on your phone and Next lines); \" +\n    \"commit both as \\\"docs(\" + id + \"): progress log\\\"; then end with the Studio update block from CLAUDE.md.\"\n}));\n", "settings": "{\n  \"hooks\": {\n    \"Stop\": [\n      {\n        \"hooks\": [\n          {\n            \"type\": \"command\",\n            \"command\": \"node\",\n            \"args\": [\"${CLAUDE_PROJECT_DIR}/.claude/hooks/studio-check.cjs\"]\n          }\n        ]\n      }\n    ]\n  }\n}\n", "protocol": "## Studio protocol (every slice)\nThe Studio reads `docs/stories.md`, `docs/progress.md`, `.git/HEAD` and `.git/logs/HEAD` from this folder. Keep the formats exact.\n\n1. Work on one slice from `docs/stories.md` at a time, in the order listed.\n2. When it's built and tested, change its line to `- [~]` (built, check it on a phone). Only Shawn marks `- [x]`; The Studio does it when he presses Mark done.\n3. Add an entry at the top of `docs/progress.md`, under the intro:\n   ```\n   ## YYYY-MM-DD · S# · Title\n   - Built: what changed, in a sentence or two\n   - Tests: what ran and the result, e.g. 31 passed\n   - Check on your phone: what Shawn should try\n   - Next: S# · title of the next slice\n   ```\n4. Commit the code and both docs together as `feat(S#): <title>`. The Studio reads commit hashes from git, so no Commit line is needed.\n5. The Stop hook in `.claude/hooks/studio-check.cjs` won't let you end a turn while the last commit is `feat(S#)` and steps 2–4 aren't done for that slice.\n6. End the session with a Studio update block. Shawn pastes it into The Studio when it can't reach this folder (on his phone, say):\n   ```\n   Studio update · {{NAME}}\n   - [~] S# · Title\n   ## YYYY-MM-DD · S# · Title\n   - Built: …\n   - Tests: …\n   - Check on your phone: …\n   - Next: …\n   ```"}/*END_SETUP_JSON*/;
function setupPrompt(p){
  const name = p && cleanRepo(p.repo) ? repoName(p.repo) : (p ? p.name : "my-app");
  return [
    `Set up The Studio's protocol in this repo (${name}) so The Studio can follow your progress. Do all five steps, then commit as "chore: add Studio protocol".`,

}

/* ---------- Repo sync through the laptop's file server (S16) ---------- */
const HOST = "host:filesystem";
const NO_HOST = ["not_granted", "capability_disabled", "capability_removed"];
function resultText(r){
  if (!r) return "";
  if (typeof r.payload === "string") return r.payload;
  if (r.payload && typeof r.payload.content === "string") return r.payload.content;
  return (r.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}
async function readFile(path, tail){
  const input = tail ? {path, tail} : {path};
  try { return resultText(await S.mcp.callTool(HOST, "read_text_file", input, {cache:false})); }
  catch(e){
    if (!(e && e.retryable)) throw e;           // reads may retry once, after a short random wait
    await new Promise(r => setTimeout(r, Math.min(e.retryAfterMs || 0, 5000) + 500 + Math.random() * 1000));
    return resultText(await S.mcp.callTool(HOST, "read_text_file", input, {cache:false}));
  }
}
function syncError(e, repo){
  const c = e && e.code, msg = String((e && e.message) || "");
  if (c === "tool_error"){
    if (/outside|denied|not allowed|permission/i.test(msg)) return {text:`${repo} is outside the folders the file server can read. Check the folder name.`};
    if (/ENOENT|no such file|not found|cannot find|does not exist/i.test(msg)) return {missing:true, text:`There's no docs/stories.md in ${repo}.`};
    return {text:"The file server said: " + clip(msg, 160)};
  }
  return {text:({
    server_not_connected:"The file server isn't running in the Claude app on this laptop. Check claude_desktop_config.json, then restart the app.",
    not_in_manifest:"Laptop access is off for The Studio. Press Try again and allow it when the Claude app asks.",
    approval_required:"The Claude app needs your OK before The Studio reads the repo. Press Try again to be asked.",
    cancelled:"You declined in the Claude app, so nothing was read.",
    server_unavailable:"The file server didn't answer in time. Try again in a moment.",
    blocked_by_policy:"Your organisation's settings block the file server for this page.",
    needs_reauth:"The file server needs reconnecting in the Claude app."
  })[c] || `Something went wrong reading the repo (${c || "unknown error"}).`};
}

async function syncProject(p, manual){
  const repo = cleanRepo(p.repo);
  if (!repo || !S.mcp || S.host !== "listed") return;
  if ((S.sync[p.id] || {}).kind === "reading") return;
  if (p.repo !== repo){ p.repo = repo; saveProject(p, true); }   // drop quotes from "Copy as path" and trailing slashes
  S.autoDone[p.id] = true;
  S.sync[p.id] = {kind:"reading", startedAt:Date.now()};
  softRender();
  const slow = setTimeout(() => { if ((S.sync[p.id] || {}).kind === "reading") softRender(); }, 2600);
  try {
    const stories = await readFile(joinPath(repo, "docs", "stories.md"));
    const [prog, head, reflog] = await Promise.allSettled([
      readFile(joinPath(repo, "docs", "progress.md")),
      readFile(joinPath(repo, ".git", "HEAD")),
      readFile(joinPath(repo, ".git", "logs", "HEAD"), 80)
    ]);
    const prev = S.syncs[p.id] || {}, slices = parseStories(stories), marks = {};
    for (const [id, at] of Object.entries(prev.marks || {})){ const s = slices.find(x => x.id === id); if (s && s.status !== "done") marks[id] = at; }
    const snap = {
      repo, repoName:repoName(repo), via:"laptop", at:Date.now(), slices, marks,
      branch: head.status === "fulfilled" ? ((/ref:\s*refs\/heads\/(\S+)/.exec(head.value) || [])[1] || "").slice(0, 60) : "",
      log: prog.status === "fulfilled" ? parseProgress(prog.value) : [],
      commits: reflog.status === "fulfilled" ? parseReflog(reflog.value) : []
    };
    S.syncs[p.id] = snap;
    S.sync[p.id] = {kind:"ok", at:Date.now()};
    if (manual) toast(`Synced: ${slices.length} slices, ${snap.log.length} log entries.`);
    try { await store.put("syncs", p.id, snap); } catch(e){ setStatus(dbErr(e), true); }
  } catch(e){
    if (e && NO_HOST.includes(e.code)){ S.host = "none"; S.sync[p.id] = {}; }
    else S.sync[p.id] = {kind:"error", code:e && e.code, ...syncError(e, repo)};
  } finally {
    clearTimeout(slow);
    softRender();
  }
}
function maybeAutoSync(){
  if (S.route.view !== "project" || S.host !== "listed" || !S.online) return;
  const p = proj(S.route.id);
  if (!p || S.autoDone[p.id] || (S.route.phase || p.phase) !== "build") return;
  if (!cleanRepo(p.repo)){ S.autoDone[p.id] = true; return; }   // opening syncs; typing a folder doesn't
  syncProject(p, false);
}

/* Mark done: on the laptop, change [~] to [x] in docs/stories.md (the Claude app asks first).
   Elsewhere, keep the mark in the snapshot until it's written from the laptop. */
async function writeDone(p, ids){
  const repo = cleanRepo(p.repo), path = joinPath(repo, "docs", "stories.md");
  const slices = parseStories(await readFile(path));
  const edits = ids.map(id => slices.find(s => s.id === id)).filter(s => s && s.status !== "done").map(s => ({oldText:s.raw, newText:s.raw.replace(/\[[ ~]\]/, "[x]")}));
  if (edits.length) await S.mcp.callTool(HOST, "edit_file", {path, edits}, {cache:false});
}
async function markDone(p, ids){
  if (S.host === "listed" && cleanRepo(p.repo) && S.online){
    try {
      await writeDone(p, ids);
      toast(`${ids.join(", ")} marked done in docs/stories.md.`);
      await syncProject(p, false);
      return;
    } catch(e){
      if (e && e.code === "cancelled"){ toast("Not changed. You declined in the Claude app."); return; }
      if (e && NO_HOST.includes(e.code)) S.host = "none";
      toast(`Couldn't write docs/stories.md (${(e && e.code) || "error"}). Kept the mark in The Studio.`);
    }
  }
  const snap = S.syncs[p.id]; if (!snap) return;
  snap.marks = {...(snap.marks || {})};
  for (const id of ids) snap.marks[id] = Date.now();
  render();
  try { await store.put("syncs", p.id, snap); if (S.host !== "listed") toast(`${ids.join(", ")} marked done. It goes into docs/stories.md from your laptop.`); }
  catch(e){ toast(dbErr(e)); }
}

function readPaste(text, p){
  const up = parseUpdate(text);
  if (!up.slices.length && !up.entries.length) return {error:true, text};
  const prev = S.syncs[p.id] || {};
  const key = e => [e.date, e.id, e.title].join("|"), have = new Set((prev.log || []).map(key));
  const name = (/Studio update\s*·\s*(\S+)/.exec(text) || [])[1];
  return {text, name, ...up, fresh:up.entries.filter(e => !have.has(key(e))).length};
}
async function applyPaste(p){
  const x = S.paste; if (!x || x.error) return;
  const prev = S.syncs[p.id] || {repo:cleanRepo(p.repo), repoName:x.name || repoName(p.repo), slices:[], log:[], commits:[], marks:{}, branch:""};
  const slices = (prev.slices || []).map(s => ({...s}));
  for (const u of x.slices){
    const s = slices.find(y => y.id === u.id);
    if (s){ s.status = u.status; if (u.title) s.title = u.title; }
    else slices.push({...u, group:slices.length ? slices[slices.length - 1].group : ""});
  }
  const key = e => [e.date, e.id, e.title].join("|"), have = new Set((prev.log || []).map(key));
  const marks = {...(prev.marks || {})};
  for (const id of Object.keys(marks)) if (slices.some(s => s.id === id && s.status === "done")) delete marks[id];
  const snap = {...prev, slices, marks, log:x.entries.filter(e => !have.has(key(e))).concat(prev.log || []).slice(0, 30), via:"paste", at:Date.now()};
  S.syncs[p.id] = snap; S.sync[p.id] = {}; S.paste = null; S.overlay = null; render();
  try { await store.put("syncs", p.id, snap); toast("Update applied."); } catch(e){ toast(dbErr(e)); }
}

async function copyText(text, el){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try { if (el){ el.focus(); el.select(); } if (document.execCommand("copy")) return true; } catch(_){}
    return false;
  }
}

function createProject({name, start, oneLiner, captureId}){
  const id = uid("p");
  const p = normalize({id, name:name || "Untitled project", phase:start, oneLiner:oneLiner || "", createdAt:Date.now(), source:captureId || null});
  if (start === "define") p.completed.discover = true;
  S.projects.unshift(p);
  saveProject(p, true);
  return p;
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act],[data-open]");
  if (!t) return;
  if (t.dataset.open && !ev.target.closest("a,button")){ go(t.dataset.review ? prepReview(t.dataset.review) : "p-" + t.dataset.open); return; }
  const act = t.dataset.act;
  if (act === "close" && ev.target !== t) return;
  const p = S.route.view === "project" ? proj(S.route.id) : null, ck = p ? coachRef(p).ck : null;   // ck: the chat this view's coach uses
  switch (act){
    case "capture": openOverlay("capture"); break;
    case "openreview": prepReview(t.dataset.id); break;   // S1: the link's own href then opens the phase
    case "newproject": openOverlay("newproject"); break;
    case "close": closeOverlay(); break;
    case "promote": {
      const c = S.captures.find(x => x.id === t.dataset.id); if (!c) break;
      const sc = capScores(c);
      const name = (c.triage && c.triage.title) || c.text.split(/\s+/).slice(0, 6).join(" ").replace(/[.,;:]$/, "");
      const np = createProject({name, start:"discover", captureId:c.id});
      if (complete(sc)){
        np.triage = {scores:sc, verdict:capVerdict(c), reasoning:(c.triage && c.triage.reasoning) || "", tags:(c.triage && c.triage.tags) || [], at:Date.now()};
        if (RUBRIC.every(r => sc[r.key] >= 3)) np.checks.discover[2] = true;   // "Score of 3 or more on every rubric row"
        saveProject(np, true);
      }
      c.status = "promoted"; c.projectId = np.id;
      try { await store.put("captures", c.id, c); } catch(e){}
      go("p-" + np.id); toast("Promoted. It starts in Discover.");
      break;
    }
    case "discard": {
      const id = t.dataset.id; S.captures = S.captures.filter(x => x.id !== id);
      if (S.route.cap === id) go("inbox"); else render();
      try { await store.del("captures", id); toast("Discarded."); } catch(e){ toast(dbErr(e)); }
      break;
    }
    case "finish": {
      if (!p) break;
      const key = p.phase, [d, tot] = progress(p, key);
      if (d < tot && !t.dataset.force){ S.confirm = "gate"; render(); break; }
      S.confirm = null; p.completed[key] = true;
      const nx = PHASES[PH[key].n]; if (nx){ p.phase = nx.key; p.nextStep = ""; }
      saveProject(p, true);
      if (nx){ toast(`${PH[key].name} done. On to ${nx.name}.`); go("p-" + p.id); }
      else { toast("Shipped. Start the next loop at Define when feedback is in."); go("board"); }
      break;
    }
    case "cancelgate": S.confirm = null; render(); break;
    case "ifilter": S.ifilter = t.dataset.f; render(); break;
    case "about": openOverlay("about"); break;
    case "triageall": {
      const list = inboxCaps().filter(needsTriage);
      for (let i = 0; i < list.length; i += 8) await triage(list.slice(i, i + 8));   // batches of 8, one after another
      break;
    }
    case "retriage": { const c = S.captures.find(x => x.id === t.dataset.id); if (c){ delete c.you; triage([c], true); } break; }
    case "score": case "verdict": {
      const c = S.captures.find(x => x.id === t.dataset.id); if (!c) break;
      c.you = c.you || {};
      if (act === "score"){
        const k = t.dataset.k, n = +t.dataset.v, mine = c.you.scores || {};
        if (c.triage && c.triage.scores && c.triage.scores[k] === n) delete mine[k]; else mine[k] = n;
        if (Object.keys(mine).length) c.you.scores = mine; else delete c.you.scores;
      } else if (t.dataset.v) c.you.verdict = t.dataset.v; else delete c.you.verdict;

      render();

    }

      for (const x of PHASES){ if (PH[x.key].n < n) p.completed[x.key] = true; else delete p.completed[x.key]; }

    }
    case "sync": if (p) syncProject(p, true); break;
    case "btab": S.buildTab = t.dataset.tab === "log" ? "log" : "slices"; render(); break;
    case "slice": {
      if (!p || (ev.target !== t && ev.target.closest("a,button") && ev.target.closest("a,button") !== t)) break;

    }

    case "pasteback": S.paste = {text:(S.paste && S.paste.text) || ""}; render(); break;
    case "applypaste": { const q = proj(S.overlayFor); if (q) applyPaste(q); break; }

    }
    case "markdone": if (p) markDone(p, [t.dataset.id]); break;
    case "writemarks": {

      const ids = Object.keys(snap.marks || {}).filter(id => (snap.slices || []).some(s => s.id === id && s.status !== "done"));
      if (ids.length) markDone(p, ids);
      break;
    }
    case "dtab": S.dtab = t.dataset.tab === "outputs" ? "outputs" : "coach"; render(); break;
    /* S5: Define and Design */
    case "ftab":
      S.ftab = ["doc", "coach", "checklist"].includes(t.dataset.tab) ? t.dataset.tab : "doc";
      if (S.ftab === "coach" && t.closest(".dempty")) S.focusCompose = !isMobile();
      render(); break;
    case "doctab": if (p){ const v = S.route.phase || p.phase; flushEdit(); S.doctab[p.id + v] = t.dataset.tab; render(); } break;
    case "editdoc": if (p){
      const v = S.route.phase || p.phase, id = t.dataset.id;
      if (!S.docs[id] && docDef(v, t.dataset.k)) S.docs[id] = docRec(p.id, v, t.dataset.k);
      if (!S.docs[id]) break;
      if (S.drafting[id] && !S.drafting[id].busy) delete S.drafting[id];
      flushEdit(); S.editing = id; S.focusEditor = 0; render();
    } break;
    case "donedit": flushEdit(); render(); { const b = [...document.querySelectorAll('[data-act="editdoc"]')].find(x => x.offsetParent); if (b) b.focus(); } break;
    case "newadr": if (p){
      const n = adrsOf(p.id).reduce((a, d) => Math.max(a, d.n || 0), 0) + 1, key = "adr-" + uid(""), {text, caret} = newAdrText(n);
      flushEdit();
      saveDoc({id:docId(p.id, key), pid:p.id, phase:"design", key, kind:"adr", n, text, createdAt:Date.now(), updatedAt:0}, true, true);
      S.adrOpen[p.id] = docId(p.id, key); S.editing = docId(p.id, key); S.focusEditor = caret; render();
    } break;
    case "openadr": if (p){ flushEdit(); S.adrOpen[p.id] = t.dataset.id; render(); } break;
    case "closeadr": if (p){ flushEdit(); S.adrOpen[p.id] = null; render(); } break;
    case "askdeladr": S.confirm = "deladr"; render(); break;
    case "deladr": if (p){
      const id = t.dataset.id; if (!S.docs[id]) break;
      clearTimeout(S.docT[id]); S.docDirty.delete(id); delete S.docs[id]; noteDraft(id);
      S.adrOpen[p.id] = null; S.editing = null; S.confirm = null; render();
      if (S.docW[id]) toast("ADR deleted.");   // the write in flight deletes it when it ends
      else store.del("docs", id).then(() => toast("ADR deleted."), e => toast(dbErr(e)));
    } break;
    case "importdoc": if (p){ const v = S.route.phase || p.phase; flushEdit(); S.imp = {pid:p.id, phase:v, key:t.dataset.k, folder:p.repo, state:"idle"}; openOverlay("import"); } break;
    /* S6: drafts */
    case "draftdoc": if (p){
      const v = S.route.phase || p.phase; if (!isDocPhase(v)) break;
      let id = t.dataset.id || "", key = t.dataset.k || "";
      if (!id && key === "adr"){   // a new ADR for Claude to draft
        const n = adrsOf(p.id).reduce((a, d) => Math.max(a, d.n || 0), 0) + 1, k = "adr-" + uid("");
        id = docId(p.id, k); saveDoc({id, pid:p.id, phase:"design", key:k, kind:"adr", n, text:"", createdAt:Date.now(), updatedAt:0}, true, true);
      }
      if (!id) id = docId(p.id, key);
      if (!S.docs[id] && docDef(v, key)) S.docs[id] = docRec(p.id, v, key);
      const d = S.docs[id]; if (!d) break;
      flushEdit(); S.confirm = null;
      if (d.kind === "adr"){ S.doctab[p.id + v] = "adr"; S.adrOpen[p.id] = id; } else S.doctab[p.id + v] = d.key;
      if (isMobile() && t.closest(".sidecoach")) S.ftab = "doc";   // on a phone, watch it being written
      draftDoc(p, v, id);
    } break;
    case "stopdraft": { const st = S.drafting[t.dataset.id]; if (st && st.ctrl) st.ctrl.abort(); break; }
    case "usedraft": {
      const d = S.docs[t.dataset.id]; if (!d || !d.draft) break;
      if (S.editing === d.id) flushEdit();
      d.text = d.draft.text; delete d.draft; delete S.dview[d.id]; delete S.drafting[d.id];
      saveDoc(d, true, true); d.drafted = {at:d.editedAt};
      if (t.dataset.edit){ S.editing = d.id; S.focusEditor = 0; }
      render(); toast(t.dataset.edit ? "Draft used. Edit away; it saves as you type." : "Draft used. It's your saved version now.");
      break;
    }
    case "discarddraft": { const d = S.docs[t.dataset.id]; if (!d || !d.draft) break; delete d.draft; delete S.dview[d.id]; saveDoc(d, true); render(); toast("Draft discarded."); break; }
    case "dview": S.dview[t.dataset.id] = t.dataset.v === "saved" ? "saved" : "draft"; render(); break;
    case "showdoc": if (p){ const v = S.route.phase || p.phase; S.doctab[p.id + v] = t.dataset.k; if (isMobile()) S.ftab = "doc"; render(); } break;
    /* S7: tracked changes */
    case "accept": case "reject": case "undochange": {
      const d = S.docs[t.dataset.id]; if (!inReview(d)) break;
      const rv = reviewModel(d), i = +t.dataset.i, h = rv.hunks[i]; if (!h) break;
      decide(d, [h.sig], act === "accept" ? "a" : act === "reject" ? "r" : null);
      if (t.closest(".rnav")){ S.curChg[d.id] = act === "undochange" ? i : nextPending(d, rv, i); S.scrollChg = true; }   // the toolbar and keys walk through the changes
      else S.curChg[d.id] = i;
      render(); break;
    }
    case "acceptall": { const d = S.docs[t.dataset.id]; if (!inReview(d)) break; decide(d, reviewModel(d).hunks.filter(h => !d.draft.decisions[h.sig]).map(h => h.sig), "a"); render(); break; }
    case "rejectrest": {
      const d = S.docs[t.dataset.id]; if (!inReview(d)) break;
      const rv = reviewModel(d), any = rv.hunks.some(h => d.draft.decisions[h.sig] === "a");
      decide(d, rv.hunks.filter(h => !d.draft.decisions[h.sig]).map(h => h.sig), "r");
      if (!any) finishReview(d, "Draft discarded. Your saved version is unchanged."); else render();
      break;
    }
    case "finishreview": { const d = S.docs[t.dataset.id]; if (d && d.draft) finishReview(d); break; }
    case "gochange": S.curChg[t.dataset.id] = +t.dataset.i; S.scrollChg = true; render(); break;
    case "prevchg": case "nextchg": {
      const d = S.docs[t.dataset.id]; if (!inReview(d)) break;
      const rv = reviewModel(d), n = rv.hunks.length; if (!n) break;
      S.curChg[d.id] = (curChange(d.id, rv) + (act === "nextchg" ? 1 : -1) + n) % n; S.scrollChg = true; render(); break;
    }
    case "ronly": { const id = t.dataset.id; S.ronly[id] = !(S.ronly[id] ?? isMobile()); render(); break; }
    case "askwhy": if (p) explainChanges(p, routePhase(), t.dataset.id); break;
    case "interview": if (p){ const c = S.chats[ck] || (S.chats[ck] = emptyChat()); c.free = false; sendCoach(p, INTERVIEW_ASK[coachRef(p).phase]); } break;
    case "freechat": if (p && S.chats[ck]){
      const c = S.chats[ck], m = lastCoach(c);
      if (m && m.meta && m.meta.q && c.messages[c.messages.length - 1] === m) m.meta.skipped = true;   // his next message isn't an answer to it
      c.free = true; S.focusCompose = !isMobile(); render(); saveChat(ck);
    } break;
    case "choose": if (p){ const c = S.chats[ck], m = c && lastCoach(c), ch = m && m.meta && m.meta.choices && m.meta.choices[+t.dataset.i]; if (ch) sendCoach(p, ch, {choice:true}); } break;
    case "stopcoach": if (p && S.coach[ck] && S.coach[ck].ctrl) S.coach[ck].ctrl.abort(); break;
    case "retrycoach": if (p) retryCoach(p); break;
    case "trimlater": if (p){ S.trimLater[ck] = true; render(); } break;
    case "trimchat": {
      const c = p && S.chats[ck]; if (!c || (S.coach[ck] && S.coach[ck].busy)) break;
      const n = trimCount(c); if (!n) break;
      c.messages.splice(0, n); c.trimmed = (c.trimmed || 0) + n; delete S.trimLater[ck];
      saveChat(ck); render(); toast(`Trimmed ${n} old messages.`);
      break;
    }
    case "change": {
      const m = p && findMsg(ck, t.dataset.id); if (!m || !m.meta || !m.meta.q) break;
      S.drafts[ck] = `Change my answer to "${m.meta.q.text}": `; render();
      const ci = $("#coach-input"); if (ci){ ci.focus(); ci.setSelectionRange(ci.value.length, ci.value.length); }
      break;
    }
    case "useone": case "usescores": {
      const m = p && findMsg(p.id, t.dataset.id); if (!m || !m.meta) break;
      if (act === "useone"){
        p.oneLiner = m.meta.oneliner || "";
        if (p.oneLiner && !/\[|\bTBD\b/i.test(p.oneLiner)) p.checks.discover[0] = true;   // "The one-liner is written and every blank is filled"
        m.meta.usedOne = true; toast("One-liner saved to the project.");
      } else {
        const sc = m.meta.scores; if (!sc) break;
        p.triage = {scores:{...sc}, verdict:ruleVerdict(sc), reasoning:"", tags:(p.triage && p.triage.tags) || [], at:Date.now(), from:"coach"};
        p.checks.discover[2] = RUBRIC.every(r => sc[r.key] >= 3);   // "Score of 3 or more on every rubric row"
        m.meta.usedScores = true; toast("Idea score saved to the project.");
      }
      saveProject(p, true); saveChat(p.id); render();
      break;
    }
    case "reopen": { if (!p) break; const key = S.route.phase || p.phase; delete p.completed[key]; p.phase = key; saveProject(p, true); render(); break; }
    case "askdelete": S.confirm = "delete"; render(); break;
    case "delete": {
      if (!p) break; S.projects = S.projects.filter(x => x.id !== p.id); S.confirm = null; go("board");
      try { await store.del("projects", p.id); toast("Project deleted."); } catch(e){ toast(dbErr(e)); }
      for (const c of [p.id, p.id + "~define", p.id + "~design"]) store.del("chats", c).catch(() => {});
      deleteDocsOf(p.id);
      break;
    }
  }
});

});

document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "coachForm"){ const p = proj(S.route.id), el = $("#coach-input"); if (p && el && el.value.trim()) sendCoach(p, el.value); }
  if (ev.target.id === "impForm") importDoc();
  if (ev.target.id === "capForm"){ const v = $("#cap-text").value.trim(); if (v) saveCapture(v); }
  if (ev.target.id === "npForm"){
    const name = $("#np-name").value.trim(), start = (document.querySelector('input[name="start"]:checked') || {}).value || "discover", one = $("#np-one").value.trim();
    S.overlay = null; const p = createProject({name, start, oneLiner:one}); go("p-" + p.id);
  }
  if (ev.target.id === "aboutForm"){
    const v = $("#about-text").value.trim().slice(0, 600);
    S.about = v; S.overlay = null; render();
    store.put("settings", "about", {text:v}).then(() => toast("Saved. Claude uses it for the next triage."), e => toast(dbErr(e)));
  }
  if (ev.target.id === "pasteForm"){
    const p = proj(S.overlayFor), v = $("#paste-text").value;
    if (p && v.trim()){ S.paste = readPaste(v, p); render(); }
  }
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && S.overlay){ closeOverlay(); return; }
  if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey) && ev.target.id === "cap-text"){ ev.preventDefault(); $("#capForm").requestSubmit(); return; }
  if (ev.key === "Enter" && ev.target.id === "coach-input" && !ev.shiftKey && !ev.isComposing && !isMobile()){ ev.preventDefault(); $("#coachForm").requestSubmit(); return; }
  if (ev.key === "Escape" && !S.overlay && ev.target.id === "doc-editor"){ ev.preventDefault(); const b = $('.dtools [data-act="donedit"]'); if (b) b.click(); return; }
  if (ev.key === "Escape" && !S.overlay){ const b = $('.ibar [data-act="freechat"]'); if (b){ ev.preventDefault(); b.click(); return; } }
  const typing = ev.target.closest && ev.target.closest("input,textarea,select,[contenteditable]");
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey || S.overlay) return;
  const k = ev.key.toLowerCase();
  if (k === "c"){ ev.preventDefault(); openOverlay("capture"); }
  else if (k === "n"){ ev.preventDefault(); openOverlay("newproject"); }
  else if (k === "b") go("board");
  else if (k === "i") go("inbox");
  else if (ev.key === "?"){ openOverlay("keys"); }
  else if (k === "s" && S.route.view === "project"){ const p = proj(S.route.id); if (p && (S.route.phase || p.phase) === "build") syncProject(p, true); }
  else if (k.length === 1 && "arjku".includes(k) && S.route.view === "project" && $(".rnav")){   // S7: review keys (desktop)
    const b = $(ev.key === "A" ? '.rbar [data-act="acceptall"]' : `.rnav [data-act="${({a:"accept", r:"reject", j:"nextchg", k:"prevchg", u:"undochange"})[k]}"]`);
    if (b && b.offsetParent){ ev.preventDefault(); b.click(); }
  }
  else if (k === "e" && S.route.view === "project"){ const b = [...document.querySelectorAll('.dtools [data-act="editdoc"], .dempty [data-act="editdoc"]')].find(x => x.offsetParent); if (b){ ev.preventDefault(); b.click(); } }
  else if (/^[1-9]$/.test(k) && S.route.view === "board"){ const p = active()[+k - 1]; if (p) go("p-" + p.id); }
  else if (/^[1-9]$/.test(k) && S.route.view === "project"){ const b = [...document.querySelectorAll(`.choices [data-act="choose"][data-i="${+k - 1}"]`)].find(x => x.offsetParent); if (b && !b.disabled){ ev.preventDefault(); b.click(); } }
});

window.addEventListener("online", () => { S.online = true; render(); });
window.addEventListener("offline", () => { S.online = false; render(); });

/* ---------- Boot ---------- */
function use(name){
  try { return (window.claude && typeof window.claude.use === "function") ? window.claude.use(name).catch(() => null) : Promise.resolve(null); }
  catch(e){ return Promise.resolve(null); }
}
function startLocal(note){ S.backend = "local"; S.loadNote = note; localChanged(); render(); }

function subscribe(col, apply){
  return new Promise(resolve => {
    let first = true;
    S.db.collection(col).onSnapshot(snap => {
      const list = snap.docs.filter(d => d.exists).map(d => ({...JSON.parse(JSON.stringify(d.data() || {})), id:d.id}));
      apply(list, snap.metadata);
      if (first){ first = false; resolve(snap.metadata); }
      else softRender();
    }, err => { if (first){ first = false; resolve({error:err}); } else setStatus("Lost the connection to your data. Reload to reconnect.", true); });
  });
}

/* Is the laptop's file server reachable? Only inside the Claude desktop app, for the owner. */
async function detectHost(){
  const m = await use("mcp");
  S.mcp = m;
  if (!m){ S.host = "none"; softRender(); return; }
  try {
    const r = await m.listTools(HOST);
    S.host = (r.servers || []).some(s => s.server === HOST && (s.tools || []).length) ? "listed" : "none";
  } catch(e){ S.host = "none"; }
  softRender();
}

async function boot(){
  S.route = readRoute();
  render();
  detectHost();
  use("sample").then(s => { S.sample = s; softRender(); });
  if (window.matchMedia) matchMedia("(max-width: 820px)").addEventListener("change", () => softRender());
  const db = await use("db");
  if (!db){ startLocal("Open The Studio on claude.ai while signed in to save to your account."); return; }
  S.db = db;
  const timer = setTimeout(() => { if (S.backend === "loading"){ S.loadNote = "Check your connection. The Studio keeps trying."; render(); } }, 10000);
  const [a] = await Promise.all([
    subscribe("projects", list => { const keep = new Map(S.projects.map(p => [p.id, p])); S.projects = list.map(p => S.dirty.has(p.id) && keep.get(p.id) ? keep.get(p.id) : normalize(p)); for (const p of keep.values()) if (S.dirty.has(p.id) && !S.projects.some(x => x.id === p.id)) S.projects.push(p); sortAll(); }),
    subscribe("captures", list => { S.captures = list; sortAll(); }),
    subscribe("syncs", list => { S.syncs = Object.fromEntries(list.map(s => [s.id, s])); }),
    subscribe("settings", list => { const a = list.find(x => x.id === "about"); S.about = a ? String(a.text || "") : null; S.boardSet = list.find(x => x.id === "board") || null; })
  ]);
  clearTimeout(timer);
  if (a && a.error){ startLocal("Couldn't reach your saved data, so this session saves in this browser only."); return; }
  S.backend = "db";
  render();
  setTimeout(backfillDrafts, 1500);
}
boot();
</script>
